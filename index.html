<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#0e0e18;background-image:radial-gradient(ellipse 70% 50% at 50% -10%,#2c2c4a 0%,transparent 65%);color:#e8e8f0;min-height:100vh;display:flex;justify-content:center}

.playerlist{width:100%;display:flex;flex-direction:column;gap:7px}
.plrow{display:flex;align-items:center;justify-content:space-between;background:#1a1a2b;border:1px solid #26263c;border-radius:12px;padding:12px 15px;font-size:14.5px}
.plrow.dead{opacity:.42}
.plid{color:#8a8aa0;width:52px;text-align:left}
.plrole{flex:1;text-align:center;font-weight:600}
.plrole.wolf{color:#e88a8a}
.plrole.god{color:#8ab4e8}
.plrole.good{color:#8ad0a6}
.plstate{width:44px;text-align:right;font-size:12px;color:#6a6a84}

@keyframes spin{to{transform:rotate(360deg)}}
.seerresult{width:100%;max-width:300px;border-radius:20px;padding:30px 20px;margin:10px 0;border:1px solid #2e2e48;background:#1a1a2b;text-align:center}
.seerresult.bad{border-color:rgba(176,58,58,.6)}
.seerresult.good{border-color:rgba(58,139,92,.6)}

.seerresult.bad .resverdict{color:#e06c6c}
.seerresult.good .resverdict{color:#6cc98c}
.code-box{background:#13131f;border:2px solid #3a3a5c;border-radius:14px;padding:20px;text-align:center;margin:14px 0}
.code-box .lbl{font-size:12px;color:#7c7c96;letter-spacing:2px}
.code-box .num{font-size:64px;font-weight:800;color:#d4af37;letter-spacing:14px;margin:8px 0 0;font-family:Consolas,monospace;text-indent:14px}

<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script>
/* ============================================================
   全局状态
   ============================================================ */
var ROLE_INFO = {
  wolf:     { name:'狼人',   team:'wolf', icon:'🐺', desc:'每晚与同伴共同击杀一名玩家。白天要隐藏身份。' },
  seer:     { name:'预言家', team:'god',  icon:'🔮', desc:'每晚可查验一名玩家是「好人」还是「狼人」。' },
  witch:    { name:'女巫',   team:'god',  icon:'🧪', desc:'拥有解药和毒药各一瓶，全局各只能使用一次。' },
  hunter:   { name:'猎人',   team:'god',  icon:'🔫', desc:'死亡时可开枪带走一名玩家（被毒杀除外）。' },
  guard:    { name:'守卫',   team:'god',  icon:'🛡️', desc:'每晚守护一名玩家，不能连续两晚守护同一人。' },
  villager: { name:'村民',   team:'good', icon:'👤', desc:'没有技能，凭借推理和投票找出隐藏的狼人。' }
};
var ROLE_LIST = {
  6:  ['wolf','wolf','seer','witch','villager','villager'],
  7:  ['wolf','wolf','seer','witch','hunter','villager','villager'],
  8:  ['wolf','wolf','wolf','seer','witch','hunter','villager','villager'],
  9:  ['wolf','wolf','wolf','seer','witch','hunter','villager','villager','villager'],
  10: ['wolf','wolf','wolf','seer','witch','hunter','guard','villager','villager','villager'],
  11: ['wolf','wolf','wolf','wolf','seer','witch','hunter','guard','villager','villager','villager'],
  12: ['wolf','wolf','wolf','wolf','seer','witch','hunter','guard','villager','villager','villager','villager']
};

var peer = null;
var isHost = false;
var myName = '';
var hostPeerId = null;
var connections = new Map();
var hostConn = null;
var host = null;
var G = null;
var lastErr = '';
var witchSel = { heal: undefined, poison: undefined };
var connecting = false;
var myRole = null;

/* ============================================================
   工具
   ============================================================ */
function $id(x){ return document.getElementById(x) }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c] }) }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t } return a }

/* ============================================================
   房主：创建房间
   ============================================================ */
function createRoom(){
  var name = ($id('nameIpt') && $id('nameIpt').value.trim()) || '玩家';
  myName = name;
  localStorage.setItem('wolf_name', name);
  lastErr = '';
  render(); // 显示加载中
  connectAsHost(name);
}

function connectAsHost(name){
  var code = String(Math.floor(1000 + Math.random() * 9000));
  hostPeerId = 'wolfgame-' + code;
  peer = new Peer(hostPeerId, { debug: 1 });

  var opened = false;
  var timeout = setTimeout(function(){
    if(!opened){ lastErr = '连接信令服务器超时，请检查网络'; render(); }
  }, 15000);

  peer.on('open', function(id){
    opened = true;
    clearTimeout(timeout);
    isHost = true;
    host = createHostState(code, name);
    G = buildHostViewFor(host.players.get(1));
    render();
  });

  peer.on('error', function(err){
    clearTimeout(timeout);
    console.error('Peer 错误:', err);
    if(err.type === 'unavailable-id'){
      peer.destroy();
      setTimeout(function(){ connectAsHost(name) }, 200);
      return;
    }
    lastErr = '创建失败: ' + (err.type || err.message || '未知错误');
    render();
  });

  peer.on('connection', function(conn){
    conn.on('open', function(){
      connections.set(conn.peer, conn);
    });
    conn.on('data', function(data){ handleClientMessage(conn, data) });
    conn.on('close', function(){
      connections.delete(conn.peer);
      for(var it = host.players.values(), p = it.next(); !p.done; p = it.next()){
        if(p.value.peerId === conn.peer){
          p.value.connected = false;
          broadcastHostState();
          break;
        }
      }
    });
    conn.on('error', function(){});
  });
}

function createHostState(code, hostName){
  var s = {
    code: code,
    hostId: 1,
    nextId: 2,
    phase: 'lobby',
    day: 0,
    nightStep: 0,
    night: {},
    lastGuard: null,
    witchHealUsed: false,
    witchPoisonUsed: false,
    deaths: [],
    hunterId: null,
    hunterAfter: null,
    votes: {},
    voteResult: null,
    winner: null,
    allRoles: null,
    players: new Map()
  };
  s.players.set(1, {
    id: 1, name: hostName, peerId: peer.id, role: null,
    alive: true, connected: true, seerChecks: []
  });
  return s;
}

function handleClientMessage(conn, data){
  if(!host) return;

  if(data.type === 'join'){
    if(host.phase !== 'lobby'){
      conn.send({ type: 'error', msg: '游戏已开始，无法加入' });
      return;
    }
    if(host.players.size >= 12){
      conn.send({ type: 'error', msg: '房间已满' });
      return;
    }
    var id = host.nextId++;
    host.players.set(id, {
      id: id,
      name: (data.name || '玩家').slice(0, 8),
      peerId: conn.peer,
      role: null,
      alive: true,
      connected: true,
      seerChecks: []
    });
    conn.send({ type: 'joined', playerId: id });
    broadcastHostState();
  }
  else if(data.type === 'action'){
    var player = null;
    for(var it = host.players.values(), p = it.next(); !p.done; p = it.next()){
      if(p.value.peerId === conn.peer){ player = p.value; break; }
    }
    if(!player) return;
    hostHandleAction(player, data);
  }
}

function broadcastHostState(){
  if(!host) return;
  G = buildHostViewFor(host.players.get(1));
  render();
  for(var it = host.players.values(), p = it.next(); !p.done; p = it.next()){
    var pl = p.value;
    if(pl.id === 1) continue;
    var c = connections.get(pl.peerId);
    if(c && c.open){
      c.send({ type: 'update', state: buildHostViewFor(pl) });
    }
  }
}

function buildHostViewFor(player){
  var playersArr = [];
  for(var it = host.players.values(), p = it.next(); !p.done; p = it.next()){
    var pl = p.value;
    playersArr.push({ id: pl.id, name: pl.name, connected: pl.connected, alive: pl.alive });
  }
  return {
    code: host.code,
    hostId: host.hostId,
    players: playersArr,
    you: {
      id: player.id,
      name: player.name,
      isHost: player.id === host.hostId,
      alive: player.alive,
      role: player.role,
      seerChecks: player.role === 'seer' ? player.seerChecks : undefined
    },
    phase: host.phase,
    day: host.day,
    nightStep: host.nightStep,
    deaths: host.deaths,
    voteResult: host.voteResult,
    hunterId: host.hunterId,
    winner: host.winner,
    allRoles: host.allRoles,
    prompt: buildPromptFor(player)
  };
}

/* ============================================================
   客户端：加入房间
   ============================================================ */
function joinRoom(){
  var name = ($id('nameIpt') && $id('nameIpt').value.trim()) || '玩家';
  var code = ($id('codeIpt') && $id('codeIpt').value.trim()) || '';
  if(!/^\d{4}$/.test(code)){ lastErr = '请输入 4 位房间号'; render(); return; }
  myName = name;
  localStorage.setItem('wolf_name', name);
  lastErr = '';
  render();
  connectAsClient(code, name);
}

function connectAsClient(code, name){
  isHost = false;
  peer = new Peer({ debug: 1 });

  var opened = false;
  var timeout = setTimeout(function(){
    if(!opened){ lastErr = '信令服务器连接超时'; render(); }
  }, 15000);

  peer.on('open', function(){
    opened = true;
    clearTimeout(timeout);
    hostConn = peer.connect('wolfgame-' + code, { reliable: true });
    var connTimeout = setTimeout(function(){
      if(hostConn && !hostConn.open){
        lastErr = '找不到房间 ' + code + '，请确认房主已创建';
        render();
      }
    }, 12000);

    hostConn.on('open', function(){
      clearTimeout(connTimeout);
      hostConn.send({ type: 'join', name: name });
    });
    hostConn.on('data', function(data){
      if(data.type === 'joined'){
        // 记录自己的 playerId（可选）
      } else if(data.type === 'update'){
        G = data.state;
        if(!G.prompt || G.prompt.kind !== 'witch') witchSel = { heal: undefined, poison: undefined };
        render();
      } else if(data.type === 'error'){
        lastErr = data.msg;
        render();
      }
    });
    hostConn.on('close', function(){
      lastErr = '与房主断开连接';
      G = null;
      render();
    });
    hostConn.on('error', function(err){
      lastErr = '连接出错: ' + (err.type || err.message);
      render();
    });
  });

  peer.on('error', function(err){
    clearTimeout(timeout);
    console.error(err);
    if(err.type === 'peer-unavailable'){
      lastErr = '房间不存在，请检查房间号';
    } else {
      lastErr = '连接失败: ' + (err.type || err.message);
    }
    render();
  });
}

/* ============================================================
   游戏逻辑（房主侧运行）
   ============================================================ */
function buildPromptFor(player){
  if(host.phase === 'hunter' && player.id === host.hunterId){
    var targets = [];
    for(var it = host.players.values(), p = it.next(); !p.done; p = it.next()){
      if(p.value.alive && p.value.id !== player.id) targets.push(p.value.id);
    }
    return { kind: 'hunter', targets: targets };
  }
  if(!player.alive) return null;

  if(host.phase === 'night'){
    var step = host.nightStep;
    if(step === 0 && player.role === 'guard'){
      var gts = [];
      for(var it = host.players.values(), p = it.next(); !p.done; p = it.next()){
        if(p.value.alive && p.value.id !== host.lastGuard) gts.push(p.value.id);
      }
      return { kind:'guard', targets:gts, note: host.lastGuard ? ('上一晚守护了 ' + host.lastGuard + ' 号') : '' };
    }
    if(step === 1 && player.role === 'wolf'){
      var wts = [], mates = [];
      for(var it = host.players.values(), p = it.next(); !p.done; p = it.next()){
        var pl = p.value;
        if(!pl.alive) continue;
        if(pl.role !== 'wolf') wts.push(pl.id);
        else if(pl.id !== player.id) mates.push(pl.id);
      }
      return { kind:'wolf', targets:wts, mates:mates };
    }
    if(step === 2 && player.role === 'witch'){
      var canHeal = !host.witchHealUsed && host.night.wolfTarget != null;
      var canPoison = !host.witchPoisonUsed;
      if(!canHeal && !canPoison) return null;
      var pts = [];
      for(var it = host.players.values(), p = it.next(); !p.done; p = it.next()){
        if(p.value.alive && p.value.id !== player.id) pts.push(p.value.id);
      }
      return { kind:'witch', canHeal:canHeal, canPoison:canPoison, wolfVictim:host.night.wolfTarget, targets:pts };
    }
    if(step === 3 && player.role === 'seer'){
      if(host.night.seerTarget != null){
        var t = host.players.get(host.night.seerTarget);
        var isWolf = t.role === 'wolf';
        if(!player.seerChecks.some(function(c){return c.id === t.id})){
          player.seerChecks.push({ id: t.id, isWolf: isWolf });
        }
        return { kind:'seerResult', targetId:t.id, isWolf:isWolf };
      }
      var sts = [];
      for(var it = host.players.values(), p = it.next(); !p.done; p = it.next()){
        if(p.value.alive && p.value.id !== player.id) sts.push(p.value.id);
      }
      return { kind:'seer', targets:sts };
    }
    return null;
  }

  if(host.phase === 'vote' && player.alive){
    if(host.votes[player.id] != null) return null;
    var vts = [];
    for(var it = host.players.values(), p = it.next(); !p.done; p = it.next()){
      if(p.value.alive && p.value.id !== player.id) vts.push(p.value.id);
    }
    return { kind:'vote', targets:vts };
  }
  return null;
}

function hostHandleAction(player, msg){
  var kind = msg.kind, target = msg.target, data = msg.data;

  if(host.phase === 'night'){
    if(kind === 'guard' && player.role === 'guard' && host.nightStep === 0){
      host.night.guardTarget = target;
      advanceNight();
    } else if(kind === 'wolf' && player.role === 'wolf' && host.nightStep === 1){
      if(host.night.wolfTarget === undefined){
        host.night.wolfTarget = target;
        advanceNight();
      }
    } else if(kind === 'witch' && player.role === 'witch' && host.nightStep === 2){
      if(data && data.heal && !host.witchHealUsed){ host.night.heal = true; host.witchHealUsed = true; }
      if(data && data.poison && !host.witchPoisonUsed){ host.night.poison = data.poison; host.witchPoisonUsed = true; }
      host.night.witchDone = true;
      advanceNight();
    } else if(kind === 'seer' && player.role === 'seer' && host.nightStep === 3){
      if(target != null){
        host.night.seerTarget = target;
        broadcastHostState();
      } else {
        host.night.seerDone = true;
        advanceNight();
      }
    } else if(kind === 'forceSkip' && player.id === host.hostId){
      if(host.nightStep === 0){ host.night.guardTarget = null; host.nightStep = 1; }
      else if(host.nightStep === 1){ host.night.wolfTarget = null; host.nightStep = 2; }
      else if(host.nightStep === 2){ host.night.witchDone = true; host.nightStep = 3; }
      else if(host.nightStep === 3){ host.night.seerDone = true; host.nightStep = 4; }
      if(host.nightStep >= 4) resolveNight();
      else broadcastHostState();
    }
    return;
  }

  if(host.phase === 'vote'){
    if(kind === 'vote' && player.alive && host.votes[player.id] == null){
      host.votes[player.id] = target;
      var allVoted = true;
      for(var it = host.players.values(), p = it.next(); !p.done; p = it.next()){
        var pl = p.value;
        if(pl.alive && host.votes[pl.id] == null){ allVoted = false; break; }
      }
      if(allVoted) applyVote();
      else broadcastHostState();
    }
    return;
  }

  if(host.phase === 'hunter' && player.id === host.hunterId){
    if(kind === 'hunter'){
      if(target != null){
        var t = host.players.get(target);
        if(t) t.alive = false;
      }
      if(checkWin()){
        host.phase = 'over';
        host.allRoles = [];
        for(var it = host.players.values(), p = it.next(); !p.done; p = it.next()){
          host.allRoles.push({ id:p.value.id, role:p.value.role, alive:p.value.alive });
        }
        broadcastHostState();
        return;
      }
      if(host.hunterAfter === 'night'){
        host.phase = 'night'; host.day++; host.nightStep = 0; host.night = {};
        host.deaths = []; host.hunterId = null;
        broadcastHostState();
      } else {
        host.phase = 'discuss';
        broadcastHostState();
      }
    }
  }
}

function advanceNight(){
  if(host.nightStep === 0 && host.night.guardTarget !== undefined) host.nightStep = 1;
  else if(host.nightStep === 1 && host.night.wolfTarget !== undefined) host.nightStep = 2;
  else if(host.nightStep === 2 && host.night.witchDone) host.nightStep = 3;
  else if(host.nightStep === 3 && host.night.seerDone) host.nightStep = 4;
  if(host.nightStep >= 4) resolveNight();
  else broadcastHostState();
}

function resolveNight(){
  var deaths = [];
  var wt = host.night.wolfTarget;
  if(wt != null){
    var guarded = host.night.guardTarget === wt;
    var healed = host.night.heal;
    if(!guarded && !healed) deaths.push({ id: wt, cause: 'wolf' });
  }
  if(host.night.poison != null && !deaths.some(function(d){return d.id === host.night.poison})){
    deaths.push({ id: host.night.poison, cause: 'poison' });
  }
  deaths.forEach(function(d){
    var p = host.players.get(d.id);
    if(p) p.alive = false;
  });
  host.lastGuard = host.night.guardTarget;
  host.deaths = deaths;
  host.phase = 'dawn';

  var poisoned = {};
  deaths.forEach(function(d){ if(d.cause === 'poison') poisoned[d.id] = true });
  var hunter = null;
  deaths.forEach(function(d){
    var p = host.players.get(d.id);
    if(p && p.role === 'hunter' && !poisoned[d.id]) hunter = d.id;
  });
  host.hunterId = hunter;
  host.hunterAfter = 'discuss';
  broadcastHostState();
}

function checkWin(){
  var alive = [], wolves = 0;
  for(var it = host.players.values(), p = it.next(); !p.done; p = it.next()){
    if(p.value.alive){
      alive.push(p.value);
      if(p.value.role === 'wolf') wolves++;
    }
  }
  var good = alive.length - wolves;
  if(alive.length === 0){ host.winner = 'wolf'; return true; }
  if(wolves === 0){ host.winner = 'good'; return true; }
  if(wolves >= good){ host.winner = 'wolf'; return true; }
  host.winner = null;
  return false;
}

function applyVote(){
  var counts = {};
  for(var k in host.votes){
    var t = host.votes[k];
    counts[t] = (counts[t] || 0) + 1;
  }
  var max = 0, top = [];
  for(var k in counts){
    var n = counts[k];
    if(n > max){ max = n; top = [Number(k)]; }
    else if(n === max) top.push(Number(k));
  }
  host.voteResult = { counts: counts, top: top };
  host.phase = 'voteResult';
  broadcastHostState();
}

function hostStartGame(){
  var n = host.players.size;
  if(n < 6 || n > 12) return false;
  var roles = shuffle(ROLE_LIST[n].slice());
  var ids = [];
  for(var it = host.players.keys(), p = it.next(); !p.done; p = it.next()) ids.push(p.value);
  ids.forEach(function(id, i){
    var p = host.players.get(id);
    p.role = roles[i];
    p.alive = true;
    p.seerChecks = [];
  });
  host.phase = 'night'; host.day = 1; host.nightStep = 0; host.night = {};
  host.lastGuard = null; host.witchHealUsed = false; host.witchPoisonUsed = false;
  host.deaths = []; host.hunterId = null; host.hunterAfter = null;
  host.votes = {}; host.voteResult = null; host.winner = null; host.allRoles = null;
  broadcastHostState();
  return true;
}

function hostContinue(){
  if(host.phase === 'dawn'){
    if(host.hunterId){ host.phase = 'hunter'; broadcastHostState(); return; }
    host.phase = 'discuss'; broadcastHostState(); return;
  }
  if(host.phase === 'discuss'){
    host.phase = 'vote'; host.votes = {}; host.voteResult = null;
    broadcastHostState(); return;
  }
  if(host.phase === 'voteResult'){
    var vr = host.voteResult;
    var votedOut = null;
    if(vr.top.length === 1){
      var p = host.players.get(vr.top[0]);
      if(p){ p.alive = false; votedOut = p; }
    }
    if(checkWin()){
      host.phase = 'over';
      host.allRoles = [];
      for(var it = host.players.values(), pp = it.next(); !pp.done; pp = it.next()){
        host.allRoles.push({ id:pp.value.id, role:pp.value.role, alive:pp.value.alive });
      }
      broadcastHostState(); return;
    }
    if(votedOut && votedOut.role === 'hunter'){
      host.hunterId = votedOut.id; host.hunterAfter = 'night'; host.phase = 'hunter';
      broadcastHostState(); return;
    }
    host.phase = 'night'; host.day++; host.nightStep = 0; host.night = {};
    host.deaths = []; host.voteResult = null; host.hunterId = null;
    broadcastHostState(); return;
  }
  if(host.phase === 'over') restartHost();
}

function restartHost(){
  host.phase = 'lobby'; host.day = 0; host.nightStep = 0; host.night = {};
  host.lastGuard = null; host.witchHealUsed = false; host.witchPoisonUsed = false;
  host.deaths = []; host.hunterId = null; host.hunterAfter = null;
  host.votes = {}; host.voteResult = null; host.winner = null; host.allRoles = null;
  for(var it = host.players.values(), p = it.next(); !p.done; p = it.next()){
    p.value.role = null; p.value.alive = true; p.value.seerChecks = [];
  }
  broadcastHostState();
}

/* ============================================================
   玩家动作分发
   ============================================================ */
function sendAction(kind, target, data){
  if(isHost){
    var me = host.players.get(1);
    hostHandleAction(me, { kind: kind, target: target, data: data });
  } else {
    if(hostConn && hostConn.open){
      hostConn.send({ type: 'action', kind: kind, target: target, data: data });
    }
  }
}

function doStart(){
  if(isHost){
    if(!hostStartGame()){ lastErr = '人数必须 6-12 人'; render(); }
  }
}
function doContinue(){
  if(isHost) hostContinue();
}
function doRestart(){
  if(isHost) restartHost();
}

function act(kind, target, data){ sendAction(kind, target, data) }

function setHeal(v){ witchSel.heal = v; render() }
function setPoison(v){ witchSel.poison = v; render() }
function confirmWitch(canHeal, canPoison){
  if(canHeal && witchSel.heal === undefined) return;
  if(canPoison && witchSel.poison === undefined) return;
  act('witch', null, {
    heal: canHeal ? !!witchSel.heal : false,
    poison: canPoison ? witchSel.poison : null
  });
}

/* ============================================================
   渲染
   ============================================================ */
function render(){
  var app = $id('app');
  if(!G){ app.innerHTML = viewEntry(); return; }
  var ph = G.phase, html;
  if(ph === 'lobby')       html = viewLobby();
  else if(ph === 'night')  html = viewNight();
  else if(ph === 'dawn')   html = viewDawn();
  else if(ph === 'hunter') html = viewHunter();
  else if(ph === 'discuss')html = viewDiscuss();
  else if(ph === 'vote')   html = viewVote();
  else if(ph === 'voteResult') html = viewVoteResult();
  else if(ph === 'over')   html = viewOver();
  else html = '<div class="center-screen"><div class="spinner"></div></div>';
  app.innerHTML = html;
}

    return '<div class="panel">' + topBadge() +
      '<div class="phasehead">🗳️ 请投票</div>' +
      '<p class="muted">选择你认为的狼人</p>' +
      '<div class="grid">' + btns + '</div></div>';
  }
  return '<div class="center-screen">' + topBadge() +
    '<div style="font-size:52px">🗳️</div>' +
    '<div class="bigmsg">你已完成投票</div>' +
    '<p class="muted">等待其他玩家投票…</p></div>';
}

function viewVoteResult(){
  var me = G.you, vr = G.voteResult || { counts:{}, top:[] };
  var sorted = Object.entries(vr.counts).sort(function(a,b){ return b[1] - a[1] });
  var rows = sorted.map(function(kv){
    return '<div class="voterow"><span>' + kv[0] + '号</span><span class="vc">' + kv[1] + ' 票</span></div>';
  }).join('') || '<div class="muted">无有效票</div>';
  var verdict = vr.top.length === 1
    ? '<div class="verdict-box bad">' + vr.top[0] + '号 被投票出局</div>'
    : '<div class="verdict-box">平票（' + vr.top.map(function(i){ return i + '号' }).join('、') + '），本轮无人出局</div>';
  var btn = me.isHost
    ? '<button class="primary big" onclick="doContinue()">继 续</button>'
    : '<p class="muted" style="text-align:center">等待房主继续…</p>';
  return '<div class="panel">' + topBadge() +
    '<div class="phasehead">🗳️ 投票结果</div>' +
    '<div class="votelist">' + rows + '</div>' + verdict + btn + '</div>';
}

function viewOver(){
  var me = G.you, good = G.winner === 'good';
  var all = G.allRoles || [];
  var rows = all.map(function(p){
    var r = ROLE_INFO[p.role] || { name:'?', team:'good', icon:'❔' };
    return '<div class="plrow ' + (p.alive ? '' : 'dead') + '">' +
      '<span class="plid">' + p.id + '号</span>' +
      '<span class="plrole ' + r.team + '">' + r.icon + ' ' + r.name + '</span>' +
      '<span class="plstate">' + (p.alive ? '存活' : '出局') + '</span></div>';
  }).join('');
  var btn = me.isHost
    ? '<button class="primary big" onclick="doRestart()">再 来 一 局</button>'
    : '<p class="muted" style="text-align:center">等待房主开启新一局…</p>';
  return '<div class="panel center" style="justify-content:flex-start;padding-top:6px">' +
    '<div class="overhead ' + (good ? 'good' : 'wolf') + '">' + (good ? '🎉 好人阵营获胜' : '🐺 狼人阵营获胜') + '</div>' +
    '<div class="playerlist">' + rows + '</div>' + btn + '</div>';
}

/* ============================================================
   启动
   ============================================================ */
render();
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
</script>
