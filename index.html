<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script>
/* ============================================================
   角色配置
   ============================================================ */
var ROLE_INFO = {
  wolf:     { name:'狼人',   team:'wolf', icon:'🐺', desc:'每晚与同伴共同击杀一名玩家。' },
  seer:     { name:'预言家', team:'god',  icon:'🔮', desc:'每晚可查验一名玩家是「好人」还是「狼人」。' },
  witch:    { name:'女巫',   team:'god',  icon:'🧪', desc:'拥有解药和毒药各一瓶，全局各只能使用一次。' },
  hunter:   { name:'猎人',   team:'god',  icon:'🔫', desc:'死亡时可开枪带走一名玩家（被毒杀除外）。' },
  guard:    { name:'守卫',   team:'god',  icon:'🛡️', desc:'每晚守护一名玩家，不能连续两晚守护同一人。' },
  villager: { name:'村民',   team:'good', icon:'👤', desc:'没有技能，凭借推理和投票找出隐藏的狼人。' }
};
var ROLE_LIST = {
  6:  ['wolf','seer','witch','villager','villager','villager'],
  7:  ['wolf','seer','witch','hunter','villager','villager','villager'],
  8:  ['wolf','wolf','seer','witch','hunter','villager','villager','villager'],
  9:  ['wolf','wolf','seer','witch','hunter','guard','villager','villager','villager'],
  10: ['wolf','wolf','seer','witch','hunter','guard','villager','villager','villager','villager'],
  11: ['wolf','wolf','seer','witch','hunter','guard','villager','villager','villager','villager','villager'],
  12: ['wolf','wolf','seer','witch','hunter','guard','villager','villager','villager','villager','villager','villager']
};

var mqttClient = null;
var roomTopic = null;
var myTag = '';
var isHost = false;
var host = null;
var G = null;
var lastErr = '';
var witchSel = { heal: undefined, poison: undefined };
var aiLastSpeak = 0;
var chatJustSent = 0;

var BROKER_URL = 'wss://broker.emqx.io:8084/mqtt';
var TOPIC_PREFIX = 'wolfchinese-v14/room/';

/* ============================================================
   AI 配置
   ============================================================ */
var AI_CONFIG = {
  enabled: false,
  provider: 'puter',
  apiKey: '',
  proxyUrl: '',
  model: '',
  maxHistory: 20
};

var AI_PRESETS = {
  openrouter: {
    name: 'OpenRouter（推荐）',
    model: 'meta-llama/llama-3.1-8b-instruct:free',
    endpoint: 'https://openrouter.ai/api/v1/chat/completions',
    needProxy: false, needKey: true, format: 'openai', rateLimitMs: 3000,
    hint: 'openrouter.ai/keys 注册拿 Key'
  },
  groq: {
    name: 'Groq（最快）',
    model: 'llama-3.1-8b-instant',
    endpoint: 'https://api.groq.com/openai/v1/chat/completions',
    needProxy: false, needKey: true, format: 'openai', rateLimitMs: 1000,
    hint: 'console.groq.com 注册'
  },
  puter: {
    name: 'Puter.js（免 Key）',
    model: 'gpt-5-nano',
    endpoint: '', needProxy: false, needKey: false, format: 'puter', rateLimitMs: 3000,
    hint: 'Token由用户承担'
  },
  zhipu: {
    name: '智谱 GLM（需代理）',
    model: 'glm-4-flash-250414',
    endpoint: 'https://open.bigmodel.cn/api/paas/v4/chat/completions',
    needProxy: true, needKey: true, format: 'openai', rateLimitMs: 1000,
    hint: '完全免费但需代理'
  }
};

var AI_DEBUG = {
  lastStatus: 'never', lastMessage: '未启用 AI，使用模板发言',
  lastDuration: 0, okCount: 0, errCount: 0
};

function loadAIConfig(){
  try {
    var saved = localStorage.getItem('wolf_ai_config_v14');
    if(saved){
      var obj = JSON.parse(saved);
      AI_CONFIG.enabled = !!obj.enabled;
      AI_CONFIG.provider = obj.provider || 'openrouter';
      AI_CONFIG.apiKey = obj.apiKey || '';
      AI_CONFIG.proxyUrl = obj.proxyUrl || '';
      AI_CONFIG.model = obj.model || '';
    }
  } catch(e){}
  if(!AI_CONFIG.model){ AI_CONFIG.model = AI_PRESETS[AI_CONFIG.provider].model; }
}
function saveAIConfig(){
  localStorage.setItem('wolf_ai_config_v14', JSON.stringify({
    enabled: AI_CONFIG.enabled, provider: AI_CONFIG.provider,
    apiKey: AI_CONFIG.apiKey, proxyUrl: AI_CONFIG.proxyUrl, model: AI_CONFIG.model
  }));
}
loadAIConfig();

/* ============================================================
   工具
   ============================================================ */
function $id(x){ return document.getElementById(x) }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c] }) }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t } return a }
function pickRandom(a){ return a[Math.floor(Math.random()*a.length)] }

function getPlayerTag(){
  var tag = localStorage.getItem('wolf_player_tag');
  if(!tag){
    tag = 'p_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
    localStorage.setItem('wolf_player_tag', tag);
  }
  return tag;
}
function setNet(on){
  var el = $id('net');
  if(!el) return;
  el.className = 'netstatus ' + (on ? 'on' : 'off');
  el.innerText = on ? '● 已连接' : '○ 未连接';
}

/* ============================================================
   LLM 调用
   ============================================================ */
var llmQueue = [];
var llmProcessing = false;
var llmLastRequestTime = 0;

function queueLLM(task){
  llmQueue.push(task);
  processLLMQueue();
}

async function processLLMQueue(){
  if(llmProcessing) return;
  llmProcessing = true;
  while(llmQueue.length){
    var preset = AI_PRESETS[AI_CONFIG.provider];
    var minGap = (preset && preset.rateLimitMs) ? preset.rateLimitMs : 4000;
    var elapsed = Date.now() - llmLastRequestTime;
    if(elapsed < minGap){
      var waitMs = minGap - elapsed;
      AI_DEBUG.lastMessage = '⏳ 限流等待 ' + Math.ceil(waitMs / 1000) + ' 秒…';
      render();
      await new Promise(function(r){ setTimeout(r, waitMs) });
    }
    var task = llmQueue.shift();
    try {
      llmLastRequestTime = Date.now();
      await task();
    } catch(e){ console.error('LLM 任务失败', e); }
  }
  llmProcessing = false;
}

function extractPuterReply(response){
  if(response == null) return null;
  if(typeof response === 'string') return response;
  if(response.message){
    if(typeof response.message === 'string') return response.message;
    if(response.message.content){
      if(typeof response.message.content === 'string') return response.message.content;
      if(Array.isArray(response.message.content)){
        return response.message.content.map(function(p){ return p.text || p.content || ''; }).join('');
      }
    }
  }
  if(response.text) return response.text;
  if(response.content){
    if(typeof response.content === 'string') return response.content;
    if(Array.isArray(response.content)){
      return response.content.map(function(p){ return p.text || p.content || ''; }).join('');
    }
  }
  if(Array.isArray(response)){
    return response.map(function(item){
      if(typeof item === 'string') return item;
      if(item && item.text) return item.text;
      if(item && item.content) return item.content;
      return '';
    }).join('');
  }
  try { return JSON.stringify(response); } catch(e){}
  return null;
}

async function callLLM(systemPrompt, userPrompt, maxTokens, retryCount){
  retryCount = retryCount || 0;
  if(!AI_CONFIG.enabled){
    AI_DEBUG.lastStatus = 'disabled';
    AI_DEBUG.lastMessage = '未启用 AI';
    return null;
  }
  var preset = AI_PRESETS[AI_CONFIG.provider];
  if(preset.needKey && !AI_CONFIG.apiKey){
    AI_DEBUG.lastStatus = 'error';
    AI_DEBUG.lastMessage = '未填 API Key';
    AI_DEBUG.errCount++;
    return null;
  }
  if(preset.needProxy && !AI_CONFIG.proxyUrl){
    AI_DEBUG.lastStatus = 'error';
    AI_DEBUG.lastMessage = '需要代理地址';
    AI_DEBUG.errCount++;
    return null;
  }

  if(AI_CONFIG.provider === 'puter'){
    if(typeof puter === 'undefined' || !puter.ai){
      AI_DEBUG.lastStatus = 'error';
      AI_DEBUG.lastMessage = 'Puter.js 未加载';
      AI_DEBUG.errCount++;
      return null;
    }
    var t0 = Date.now();
    try {
      var response = await puter.ai.chat(
        [{ role:'system', content:systemPrompt }, { role:'user', content:userPrompt }],
        { model: AI_CONFIG.model }
      );
      AI_DEBUG.lastDuration = Date.now() - t0;
      var reply = extractPuterReply(response);
      if(!reply || String(reply).trim().length === 0){
        AI_DEBUG.lastStatus = 'error';
        AI_DEBUG.lastMessage = 'Puter 返回空';
        AI_DEBUG.errCount++;
        return null;
      }
      AI_DEBUG.lastStatus = 'ok';
      AI_DEBUG.lastMessage = '正常，耗时 ' + AI_DEBUG.lastDuration + 'ms';
      AI_DEBUG.okCount++;
      return String(reply).trim();
    } catch(e){
      AI_DEBUG.lastDuration = Date.now() - t0;
      AI_DEBUG.lastStatus = 'error';
      AI_DEBUG.lastMessage = 'Puter 异常：' + (e.message || e);
      AI_DEBUG.errCount++;
      return null;
    }
  }

  var url, headers, body;
  if(AI_CONFIG.provider === 'zhipu'){
    url = AI_CONFIG.proxyUrl;
    headers = { 'Content-Type': 'application/json', 'X-Zhipu-Key': AI_CONFIG.apiKey };
  } else {
    url = preset.endpoint;
    headers = { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + (AI_CONFIG.apiKey || 'not-needed') };
    if(AI_CONFIG.provider === 'openrouter'){
      headers['HTTP-Referer'] = location.origin;
      headers['X-Title'] = 'Wolf Game';
    }
  }
  body = JSON.stringify({
    model: AI_CONFIG.model,
    messages: [
      { role: 'system', content: systemPrompt },
      { role: 'user', content: userPrompt }
    ],
    max_tokens: maxTokens || 120,
    temperature: 0.9
  });

  var t1 = Date.now();
  var controller = new AbortController();
  var timeoutId = setTimeout(function(){ controller.abort() }, 20000);

  try {
    var res = await fetch(url, { method:'POST', headers:headers, body:body, signal:controller.signal });
    clearTimeout(timeoutId);
    AI_DEBUG.lastDuration = Date.now() - t1;
    var text = await res.text();

    if(res.status === 429){
      if(retryCount < 1){
        AI_DEBUG.lastMessage = '⏳ 上游限流，8 秒后重试…';
        render();
        await new Promise(function(r){ setTimeout(r, 8000) });
        return callLLM(systemPrompt, userPrompt, maxTokens, retryCount + 1);
      }
      AI_DEBUG.lastStatus = 'error';
      AI_DEBUG.lastMessage = 'HTTP 429';
      AI_DEBUG.errCount++;
      return null;
    }
    if(res.status !== 200){
      AI_DEBUG.lastStatus = 'error';
      AI_DEBUG.lastMessage = 'HTTP ' + res.status + '：' + text.slice(0, 120);
      AI_DEBUG.errCount++;
      return null;
    }

    var data;
    try { data = JSON.parse(text); } catch(e){
      AI_DEBUG.lastStatus = 'error';
      AI_DEBUG.lastMessage = '返回非 JSON';
      AI_DEBUG.errCount++;
      return null;
    }
    if(data.error){
      AI_DEBUG.lastStatus = 'error';
      AI_DEBUG.lastMessage = 'API 报错：' + JSON.stringify(data.error).slice(0, 150);
      AI_DEBUG.errCount++;
      return null;
    }

    var reply2 = null;
    if(data.choices && data.choices[0] && data.choices[0].message){
      reply2 = data.choices[0].message.content;
    }
    if(reply2){
      AI_DEBUG.lastStatus = 'ok';
      AI_DEBUG.lastMessage = '正常，耗时 ' + AI_DEBUG.lastDuration + 'ms';
      AI_DEBUG.okCount++;
      return String(reply2).trim();
    }
    AI_DEBUG.lastStatus = 'error';
    AI_DEBUG.lastMessage = '返回格式异常';
    AI_DEBUG.errCount++;
    return null;
  } catch(e){
    clearTimeout(timeoutId);
    AI_DEBUG.lastDuration = Date.now() - t1;
    AI_DEBUG.lastStatus = 'error';
    var msg2 = e.message || String(e);
    if(e.name === 'AbortError'){ msg2 = '请求超时'; }
    else if(msg2.indexOf('Failed to fetch') >= 0){ msg2 = '网络失败'; }
    AI_DEBUG.lastMessage = msg2;
    AI_DEBUG.errCount++;
    return null;
  }
}

/* ============================================================
   ID 重排
   ============================================================ */
function reindexPlayers(host){
  var ids = [];
  for(var it = host.players.keys(), p = it.next(); !p.done; p = it.next()){ ids.push(p.value); }
  ids.sort(function(a,b){ return a - b });
  var idMap = {}, newPlayers = new Map(), i = 1;
  ids.forEach(function(oldId){
    idMap[oldId] = i;
    var player = host.players.get(oldId);
    player.id = i;
    newPlayers.set(i, player);
    i++;
  });
  host.players = newPlayers;
  host.nextId = i;
  var newVotes = {};
  for(var k in host.votes){
    var nk = idMap[Number(k)], nv = idMap[host.votes[k]];
    if(nk !== undefined && nv !== undefined) newVotes[nk] = nv;
  }
  host.votes = newVotes;
  var newSV = {};
  for(var k in host.sheriffVotes){
    var nk = idMap[Number(k)], nv = idMap[host.sheriffVotes[k]];
    if(nk !== undefined && nv !== undefined) newSV[nk] = nv;
  }
  host.sheriffVotes = newSV;
  host.sheriffCandidates = host.sheriffCandidates.map(function(id){ return idMap[id] }).filter(function(x){ return x !== undefined });
  if(host.sheriffId != null) host.sheriffId = idMap[host.sheriffId];
  if(host.hunterId != null) host.hunterId = idMap[host.hunterId];
  if(host.night.wolfTarget != null) host.night.wolfTarget = idMap[host.night.wolfTarget];
  if(host.night.seerTarget != null) host.night.seerTarget = idMap[host.night.seerTarget];
  if(host.night.guardTarget != null) host.night.guardTarget = idMap[host.night.guardTarget];
  if(host.night.poison != null) host.night.poison = idMap[host.night.poison];
  if(host.lastGuard != null) host.lastGuard = idMap[host.lastGuard];
  host.deaths.forEach(function(d){ d.id = idMap[d.id] });
  if(host.allRoles){ host.allRoles.forEach(function(r){ r.id = idMap[r.id] }) }
  var newSA = {};
  for(var k in host.sheriffApplied){
    var nk = idMap[Number(k)];
    if(nk !== undefined) newSA[nk] = true;
  }
  host.sheriffApplied = newSA;
}

/* ============================================================
   房主
   ============================================================ */
function createRoom(){
  var name = ($id('nameIpt') && $id('nameIpt').value.trim()) || '玩家';
  localStorage.setItem('wolf_name', name);
  lastErr = '';
  render();
  connectAsHost(name);
}

function connectAsHost(name){
  var code = String(Math.floor(1000 + Math.random() * 9000));
  roomTopic = TOPIC_PREFIX + code;
  myTag = getPlayerTag();
  isHost = true;

  var clientId = 'wolf_host_' + code + '_' + Math.random().toString(36).slice(2, 8);
  mqttClient = mqtt.connect(BROKER_URL, {
    clientId: clientId, clean: true, reconnectPeriod: 2000,
    connectTimeout: 15000, keepalive: 30
  });

  var ready = false;
  var t = setTimeout(function(){
    if(!ready){ lastErr = '连接服务器超时，请检查网络'; render(); }
  }, 20000);

  mqttClient.on('connect', function(){
    ready = true; clearTimeout(t); setNet(true);
    mqttClient.subscribe(roomTopic, { qos: 1 }, function(err){
      if(err){ lastErr = '订阅失败'; render(); return; }
      if(!host){
        host = createHostState(code, name);
        host.players.get(1).tag = myTag;
      }
      G = buildHostViewFor(host.players.get(1));
      render();
    });
  });

  mqttClient.on('message', function(topic, payload){
    if(topic !== roomTopic) return;
    var msg;
    try { msg = JSON.parse(payload.toString()); } catch(e){ return; }
    if(msg.to !== 'host') return;
    handleClientMessage(msg);
  });

  mqttClient.on('error', function(err){ console.error('MQTT 错误', err); setNet(false); });
  mqttClient.on('close', function(){ setNet(false); });
  mqttClient.on('reconnect', function(){ setNet(false); });
}

function createHostState(code, hostName){
  var s = {
    code: code, hostId: 1, nextId: 2, phase: 'lobby', day: 0, nightStep: 0,
    night: {}, lastGuard: null, witchHealUsed: false, witchPoisonUsed: false,
    deaths: [], hunterId: null, hunterAfter: null, votes: {}, voteResult: null,
    winner: null, allRoles: null, players: new Map(),
    sheriffId: null, sheriffCandidates: [], sheriffVotes: {}, sheriffReelection: false, sheriffApplied: {},
    chatLog: [], wolfVoteTarget: null
  };
  s.players.set(1, {
    id: 1, name: hostName, tag: '', role: null,
    alive: true, connected: true, seerChecks: []
  });
  return s;
}

function handleClientMessage(msg){
  if(!host) return;

  if(msg.type === 'join'){
    var existingPlayer = null;
    for(var it = host.players.values(), p = it.next(); !p.done; p = it.next()){
      if(p.value.tag === msg.from){ existingPlayer = p.value; break; }
    }
    if(host.phase !== 'lobby' && !existingPlayer){
      publishTo(msg.from, { type: 'error', msg: '游戏已开始，无法加入' });
      return;
    }
    if(existingPlayer){
      existingPlayer.name = (msg.name || existingPlayer.name).slice(0, 8);
      existingPlayer.connected = true;
      publishTo(msg.from, { type: 'joined', playerId: existingPlayer.id });
      broadcastHostState();
      return;
    }
    if(host.players.size >= 12){
      publishTo(msg.from, { type: 'error', msg: '房间已满' });
      return;
    }
    var id = host.nextId++;
    host.players.set(id, {
      id: id, name: (msg.name || '玩家').slice(0, 8), tag: msg.from,
      role: null, alive: true, connected: true, seerChecks: []
    });
    publishTo(msg.from, { type: 'joined', playerId: id });
    broadcastHostState();
  }
  else if(msg.type === 'leave'){
    var found = null;
    for(var it = host.players.values(), p = it.next(); !p.done; p = it.next()){
      if(p.value.tag === msg.from){ found = p.value; break; }
    }
    if(found && found.id !== 1){
      host.players.delete(found.id);
      if(host.phase === 'vote' && host.votes[found.id] !== undefined) delete host.votes[found.id];
      if(host.phase === 'sheriffVote' && host.sheriffVotes[found.id] !== undefined) delete host.sheriffVotes[found.id];
      reindexPlayers(host);
      if(host.phase !== 'lobby' && host.phase !== 'over'){
        if(checkWin()) endGame();
      }
      broadcastHostState();
    }
  }
  else if(msg.type === 'chat'){
    var pl = null;
    for(var it = host.players.values(), p = it.next(); !p.done; p = it.next()){
      if(p.value.tag === msg.from){ pl = p.value; break; }
    }
    if(pl) hostSendChat(pl.id, msg.text, false);
  }
  else if(msg.type === 'action'){
    var player = null;
    for(var it = host.players.values(), p = it.next(); !p.done; p = it.next()){
      if(p.value.tag === msg.from){ player = p.value; break; }
    }
    if(!player) return;
    hostHandleAction(player, msg);
  }
}

function publishTo(tag, obj){
  if(!mqttClient || !roomTopic) return;
  var m = Object.assign({}, obj, { to: tag });
  mqttClient.publish(roomTopic, JSON.stringify(m), { qos: 1 });
}

function broadcastHostState(){
  if(!host || !mqttClient) return;
  for(var it = host.players.values(), p = it.next(); !p.done; p = it.next()){
    var pl = p.value;
    if(pl.id === 1 || pl.isAI) continue;
    publishTo(pl.tag, { type: 'update', state: buildHostViewFor(pl) });
  }
  G = buildHostViewFor(host.players.get(1));
  render();
}

function buildHostViewFor(player){
  var playersArr = [];
  for(var it = host.players.values(), p = it.next(); !p.done; p = it.next()){
    var pl = p.value;
    playersArr.push({
      id: pl.id, name: pl.name, connected: pl.connected, alive: pl.alive,
      isSheriff: pl.id === host.sheriffId, isAI: !!pl.isAI
    });
  }
  return {
    code: host.code, hostId: host.hostId, players: playersArr,
    you: {
      id: player.id, name: player.name, isHost: player.id === host.hostId,
      alive: player.alive, role: player.role,
      seerChecks: player.role === 'seer' ? player.seerChecks : undefined
    },
    phase: host.phase, day: host.day, nightStep: host.nightStep,
    deaths: host.deaths, voteResult: host.voteResult, hunterId: host.hunterId,
    winner: host.winner, allRoles: host.allRoles,
    sheriffId: host.sheriffId, sheriffReelection: host.sheriffReelection,
    sheriffApplied: host.sheriffApplied, sheriffCandidates: host.sheriffCandidates,
    chatLog: host.chatLog.slice(-30),
    prompt: buildPromptFor(player)
  };
}

/* ============================================================
   AI 管理
   ============================================================ */
function hostAddAI(){
  if(!isHost || !host) return;
  if(host.phase !== 'lobby') return;
  if(host.players.size >= 12) return;
  var id = host.nextId++;
  var aiCount = 0;
  for(var it = host.players.values(), p = it.next(); !p.done; p = it.next()){
    if(p.value.isAI) aiCount++;
  }
  host.players.set(id, {
    id: id, name: 'AI-' + (aiCount + 1), tag: 'ai_' + id + '_' + Math.random().toString(36).slice(2,6),
    isAI: true, role: null, alive: true, connected: true, seerChecks: []
  });
  broadcastHostState();
}

function hostRemoveAI(){
  if(!isHost || !host) return;
  if(host.phase !== 'lobby') return;
  var lastAI = null;
  for(var it = host.players.values(), p = it.next(); !p.done; p = it.next()){
    if(p.value.isAI) lastAI = p.value;
  }
  if(lastAI){
    host.players.delete(lastAI.id);
    reindexPlayers(host);
    broadcastHostState();
  }
}

/* ============================================================
   聊天
   ============================================================ */
function hostSendChat(playerId, text, fromModel){
  if(!host) return;
  text = String(text || '').trim().slice(0, 100);
  if(!text) return;
  var p = host.players.get(playerId);
  if(!p) return;
  if(!host.chatLog) host.chatLog = [];
  host.chatLog.push({
    id: playerId, name: p.name, isAI: !!p.isAI,
    fromModel: !!fromModel, text: text, time: Date.now()
  });
  if(host.chatLog.length > 60) host.chatLog.shift();
  broadcastHostState();
}

function playerSendChat(text){
  text = String(text || '').trim();
  if(!text) return;
  if(isHost){
    hostSendChat(1, text, false);
  } else {
    if(mqttClient && mqttClient.connected && roomTopic){
      mqttClient.publish(roomTopic, JSON.stringify({
        to: 'host', from: myTag, type: 'chat', text: text
      }), { qos: 1 });
    }
  }
}

/* ============================================================
   从聊天记录提取被怀疑最多的玩家
   ============================================================ */
function countSuspicionFromChat(candidates){
  var counts = {};
  if(!host.chatLog) return counts;
  var re1 = /(\d+)\s*号[^，。\n]{0,8}?(狼人|查杀|狼)/g;
  var re2 = /预言家[^，。\n]{0,20}?(\d+)\s*号/g;
  for(var i = 0; i < host.chatLog.length; i++){
    var c = host.chatLog[i];
    if(c.isAI && !c.fromModel) continue;
    var m;
    re1.lastIndex = 0;
    while((m = re1.exec(c.text)) !== null){
      var id = parseInt(m[1]);
      if(candidates.indexOf(id) >= 0) counts[id] = (counts[id] || 0) + 1;
    }
    re2.lastIndex = 0;
    while((m = re2.exec(c.text)) !== null){
      var id2 = parseInt(m[1]);
      if(candidates.indexOf(id2) >= 0) counts[id2] = (counts[id2] || 0) + 1;
    }
  }
  return counts;
}

/* ============================================================
   AI 行动
   ============================================================ */
function processAIActions(){
  if(!host || !isHost) return;

  if(host.phase === 'night'){
    var step = host.nightStep;
    function roleAlive(r){
      for(var it = host.players.values(), p = it.next(); !p.done; p = it.next()){
        if(p.value.alive && p.value.role === r) return true;
      }
      return false;
    }
    if(step === 0 && !roleAlive('guard')){ host.nightStep = 1; broadcastHostState(); return; }
    if(step === 1 && !roleAlive('wolf')){ host.nightStep = 2; broadcastHostState(); return; }
    if(step === 2 && !roleAlive('witch')){ host.nightStep = 3; broadcastHostState(); return; }
    if(step === 3 && !roleAlive('seer')){ resolveNight(); return; }

    if(step === 0){
      for(var it = host.players.values(), p = it.next(); !p.done; p = it.next()){
        var pl = p.value;
        if(!pl.isAI || !pl.alive || pl.role !== 'guard') continue;
        if(host.night.guardTarget !== undefined) continue;
        var gts = [];
        for(var it2 = host.players.values(), q = it2.next(); !q.done; q = it2.next()){
          if(q.value.alive && q.value.id !== host.lastGuard && q.value.id !== pl.id) gts.push(q.value.id);
        }
        host.night.guardTarget = gts.length ? pickRandom(gts) : null;
        advanceNight(); return;
      }
      return;
    }
    if(step === 1){
      for(var it = host.players.values(), p = it.next(); !p.done; p = it.next()){
        var pl = p.value;
        if(!pl.isAI || !pl.alive || pl.role !== 'wolf') continue;
        if(host.night.wolfTarget !== undefined) continue;
        var wts = [];
        for(var it2 = host.players.values(), q = it2.next(); !q.done; q = it2.next()){
          if(q.value.alive && q.value.role !== 'wolf') wts.push(q.value.id);
        }
        host.night.wolfTarget = wts.length ? pickRandom(wts) : null;
        advanceNight(); return;
      }
      return;
    }
    if(step === 2){
      for(var it = host.players.values(), p = it.next(); !p.done; p = it.next()){
        var pl = p.value;
        if(!pl.isAI || !pl.alive || pl.role !== 'witch') continue;
        if(host.night.witchDone) continue;
        var canHeal = !host.witchHealUsed && host.night.wolfTarget != null;
        var canPoison = !host.witchPoisonUsed;
        if(canHeal && Math.random() < 0.5){
          host.night.heal = true; host.witchHealUsed = true;
        } else if(canPoison && Math.random() < 0.35){
          var pts = [];
          for(var it2 = host.players.values(), q = it2.next(); !q.done; q = it2.next()){
            if(q.value.alive && q.value.id !== pl.id) pts.push(q.value.id);
          }
          if(pts.length){ host.night.poison = pickRandom(pts); host.witchPoisonUsed = true; }
        }
        host.night.witchDone = true;
        advanceNight(); return;
      }
      return;
    }
    if(step === 3){
      for(var it = host.players.values(), p = it.next(); !p.done; p = it.next()){
        var pl = p.value;
        if(!pl.isAI || !pl.alive || pl.role !== 'seer') continue;
        if(host.night.seerTarget != null) continue;
        var choices = [];
        for(var it2 = host.players.values(), q = it2.next(); !q.done; q = it2.next()){
          if(q.value.alive && q.value.id !== pl.id && !pl.seerChecks.some(function(c){ return c.id === q.value.id })) choices.push(q.value.id);
        }
        if(!choices.length){
          for(var it2 = host.players.values(), q = it2.next(); !q.done; q = it2.next()){
            if(q.value.alive && q.value.id !== pl.id) choices.push(q.value.id);
          }
        }
        if(choices.length){
          var pickId = pickRandom(choices);
          host.night.seerTarget = pickId;
          var t = host.players.get(pickId);
          if(t && !pl.seerChecks.some(function(c){ return c.id === t.id })){
            pl.seerChecks.push({ id: t.id, isWolf: t.role === 'wolf' });
          }
        }
        host.night.seerDone = true;
        advanceNight(); return;
      }
      return;
    }
    return;
  }

  if(host.phase === 'sheriffApply'){
    for(var it = host.players.values(), p = it.next(); !p.done; p = it.next()){
      var pl = p.value;
      if(!pl.isAI || !pl.alive) continue;
      if(host.sheriffApplied[pl.id]) continue;
      host.sheriffApplied[pl.id] = true;
      var shouldApply = false;
      if(pl.role === 'seer') shouldApply = true;
      else if(pl.role === 'wolf') shouldApply = Math.random() < 0.7;
      else shouldApply = Math.random() < 0.25;
      if(shouldApply) host.sheriffCandidates.push(pl.id);
      var allApplied = true;
      for(var it2 = host.players.values(), q = it2.next(); !q.done; q = it2.next()){
        if(q.value.alive && !host.sheriffApplied[q.value.id]){ allApplied = false; break; }
      }
      if(allApplied){
        if(host.sheriffCandidates.length === 0) host.phase = 'discuss';
        else if(host.sheriffCandidates.length === 1){
          host.sheriffId = host.sheriffCandidates[0]; host.phase = 'sheriffResult';
        } else {
          host.phase = 'sheriffVote'; host.sheriffVotes = {};
        }
      }
      broadcastHostState(); return;
    }
    return;
  }

  if(host.phase === 'sheriffVote'){
    for(var it = host.players.values(), p = it.next(); !p.done; p = it.next()){
      var pl = p.value;
      if(!pl.isAI || !pl.alive) continue;
      if(host.sheriffVotes[pl.id] != null) continue;
      var choices = host.sheriffCandidates.slice();
      if(pl.role === 'wolf'){
        var wolfCand = choices.filter(function(id){ var t = host.players.get(id); return t && t.role === 'wolf' && id !== pl.id; });
        if(wolfCand.length) choices = wolfCand;
      }
      host.sheriffVotes[pl.id] = choices.length ? pickRandom(choices) : pl.id;
      var allVoted = true;
      for(var it2 = host.players.values(), q = it2.next(); !q.done; q = it2.next()){
        if(q.value.alive && host.sheriffVotes[q.value.id] == null){ allVoted = false; break; }
      }
      if(allVoted) applySheriffVote();
      else broadcastHostState();
      return;
    }
    return;
  }

  if(host.phase === 'vote'){
    for(var it = host.players.values(), p = it.next(); !p.done; p = it.next()){
      var pl = p.value;
      if(!pl.isAI || !pl.alive) continue;
      if(host.votes[pl.id] != null) continue;

      var vts = [];
      for(var it2 = host.players.values(), q = it2.next(); !q.done; q = it2.next()){
        if(q.value.alive && q.value.id !== pl.id) vts.push(q.value.id);
      }
      if(!vts.length){ return; }

      if(pl.role === 'wolf'){
        if(host.wolfVoteTarget == null || vts.indexOf(host.wolfVoteTarget) < 0){
          var nonWolves = vts.filter(function(id){ var t = host.players.get(id); return t && t.role !== 'wolf'; });
          host.wolfVoteTarget = nonWolves.length ? pickRandom(nonWolves) : pickRandom(vts);
        }
        host.votes[pl.id] = host.wolfVoteTarget;
      } else if(pl.role === 'seer' && pl.seerChecks && pl.seerChecks.length){
        var wolfFound = null;
        for(var i = 0; i < pl.seerChecks.length; i++){
          if(pl.seerChecks[i].isWolf && vts.indexOf(pl.seerChecks[i].id) >= 0){
            wolfFound = pl.seerChecks[i].id; break;
          }
        }
        if(wolfFound){
          host.votes[pl.id] = wolfFound;
        } else {
          var counts = countSuspicionFromChat(vts);
          var best = null, bestN = 0;
          for(var k in counts){
            if(counts[k] > bestN){ bestN = counts[k]; best = parseInt(k); }
          }
          host.votes[pl.id] = best != null ? best : pickRandom(vts);
        }
      } else {
        var counts2 = countSuspicionFromChat(vts);
        var best2 = null, bestN2 = 0;
        for(var k in counts2){
          if(counts2[k] > bestN2){ bestN2 = counts2[k]; best2 = parseInt(k); }
        }
        if(best2 != null){
          host.votes[pl.id] = best2;
        } else {
          host.votes[pl.id] = pickRandom(vts);
        }
      }

      var allVoted = true;
      for(var it2 = host.players.values(), q = it2.next(); !q.done; q = it2.next()){
        if(q.value.alive && host.votes[q.value.id] == null){ allVoted = false; break; }
      }
      if(allVoted) applyVote();
      else broadcastHostState();
      return;
    }
    return;
  }

  if(host.phase === 'hunter' && host.hunterId){
    var h = host.players.get(host.hunterId);
    if(h && h.isAI && h.alive === false){
      var hts = [];
      for(var it = host.players.values(), p = it.next(); !p.done; p = it.next()){
        if(p.value.alive && p.value.id !== h.id) hts.push(p.value.id);
      }
      if(hts.length && Math.random() < 0.85){
        var t = host.players.get(pickRandom(hts));
        if(t) t.alive = false;
      }
      if(checkWin()){ endGame(); return; }
      if(host.hunterAfter === 'night'){
        host.phase = 'night'; host.day++; host.nightStep = 0; host.night = {};
        host.deaths = []; host.hunterId = null;
      } else { host.phase = 'discuss'; }
      broadcastHostState();
      return;
    }
    return;
  }

  if(host.phase === 'discuss'){
    var now = Date.now();
    if(now - aiLastSpeak < 10000) return;
    var ais = [];
    for(var it = host.players.values(), p = it.next(); !p.done; p = it.next()){
      if(p.value.isAI && p.value.alive) ais.push(p.value);
    }
    if(!ais.length) return;
    var ai = pickRandom(ais);

    if(canUseLLM()){
      aiSpeakByLLM(ai);
      aiLastSpeak = now;
    } else {
      var text = generateAIChatFallback(ai);
      if(text){
        hostSendChat(ai.id, text, false);
        aiLastSpeak = now;
      }
    }
    return;
  }
}

function canUseLLM(){
  if(!AI_CONFIG.enabled) return false;
  var preset = AI_PRESETS[AI_CONFIG.provider];
  if(!preset) return false;
  if(preset.needKey && !AI_CONFIG.apiKey) return false;
  if(preset.needProxy && !AI_CONFIG.proxyUrl) return false;
  return true;
}

/* ============================================================
   LLM 发言
   ============================================================ */
function buildGameContext(ai){
  var alive = [], dead = [];
  for(var it = host.players.values(), p = it.next(); !p.done; p = it.next()){
    var pl = p.value;
    if(pl.alive) alive.push(pl.id + '号');
    else dead.push(pl.id + '号');
  }
  var history = '';
  if(host.chatLog){
    history = host.chatLog.slice(-15).map(function(c){
      return c.name + ': ' + c.text;
    }).join('\n');
  }
  var myInfo = '你的身份：' + (ROLE_INFO[ai.role] ? ROLE_INFO[ai.role].name : '?');
  if(ai.role === 'wolf'){
    var mates = [];
    for(var it = host.players.values(), p = it.next(); !p.done; p = it.next()){
      if(p.value.role === 'wolf' && p.value.id !== ai.id) mates.push(p.value.id + '号');
    }
    myInfo += '；狼队友：' + (mates.join('、') || '无');
  }
  if(ai.role === 'seer' && ai.seerChecks && ai.seerChecks.length){
    myInfo += '；查验记录：' + ai.seerChecks.map(function(c){
      return c.id + '号=' + (c.isWolf ? '狼人' : '好人');
    }).join('，');
  }
  return { day: host.day, alive: alive.join('、'), dead: dead.join('、') || '无', myInfo: myInfo, history: history };
}

function aiSpeakByLLM(ai){
  var ctx = buildGameContext(ai);
  var system = '你是一个正在玩狼人杀的中国玩家，昵称"' + ai.name + '"，身份是【' +
    (ROLE_INFO[ai.role] ? ROLE_INFO[ai.role].name : '?') + '】。' +
    '请像真实玩家一样用中文发言，口语化，1-2句话，不超过60字。' +
    '关键规则：' +
    '1. 只根据「之前发言」中有明确依据的内容怀疑别人；' +
    '2. 如果之前没有人提到过某个玩家，就不要突然说"我觉得X号很奇怪"；' +
    '3. 如果你是预言家，报查验结果；如果你是狼人，可以伪装或泼脏水；' +
    '4. 如果你是村民，可以表达自己的判断，但不要总怀疑别人；' +
    '5. 如果实在没什么可说，就说"我过"或"听大家发言"；' +
    '6. 只输出你说的话本身，不要加引号、括号或解释。';

  var user = '当前是第' + ctx.day + '天讨论阶段。\n' + ctx.myInfo + '\n' +
    '存活玩家：' + ctx.alive + '\n已出局：' + ctx.dead + '\n' +
    '之前的发言：\n' + (ctx.history || '（还没有人发言）') + '\n\n' +
    '请你说一句话（60字内，不要换行）：';

  queueLLM(async function(){
    var text = null;
    try {
      text = await Promise.race([
        callLLM(system, user, 100),
        new Promise(function(resolve){ setTimeout(function(){ resolve(null) }, 12000) })
      ]);
    } catch(e){ text = null; }
    if(!text){
      text = generateAIChatFallback(ai);
      hostSendChat(ai.id, text, false);
    } else {
      text = text.replace(/^["'「『]|["'」』]$/g, '').trim().slice(0, 80);
      hostSendChat(ai.id, text, true);
    }
  });
}

/* ============================================================
   优化版模板发言
   ============================================================ */
function generateAIChatFallback(ai){
  var aliveIds = [], others = [];
  for(var it = host.players.values(), p = it.next(); !p.done; p = it.next()){
    if(p.value.alive){
      aliveIds.push(p.value.id);
      if(p.value.id !== ai.id) others.push(p.value.id);
    }
  }
  if(!others.length) return null;

  var day = host.day || 1;
  var isLate = aliveIds.length <= 4;
  var target = pickRandom(others);
  var myId = ai.id;

  var suspected = false;
  for(var i = 0; i < (host.chatLog || []).length; i++){
    var c = host.chatLog[i];
    if(c.id === myId) continue;
    var re = new RegExp('(^|[^0-9])' + myId + '\\s*号');
    if(re.test(c.text)){ suspected = true; break; }
  }

  var suspectCount = {};
  for(var i = 0; i < (host.chatLog || []).length; i++){
    var c = host.chatLog[i];
    if(c.id === myId) continue;
    var mm = c.text.match(/(\d+)\s*号/g);
    if(mm){
      for(var j = 0; j < mm.length; j++){
        var id = parseInt(mm[j]);
        if(id !== myId && others.indexOf(id) >= 0){
          suspectCount[id] = (suspectCount[id] || 0) + 1;
        }
      }
    }
  }
  var hot = null, hotN = 0;
  for(var k in suspectCount){
    if(suspectCount[k] > hotN){ hotN = suspectCount[k]; hot = parseInt(k); }
  }

  if(ai.role === 'seer'){
    var wolfFound = null;
    if(ai.seerChecks){
      for(var i = 0; i < ai.seerChecks.length; i++){
        if(ai.seerChecks[i].isWolf && others.indexOf(ai.seerChecks[i].id) >= 0){
          wolfFound = ai.seerChecks[i].id; break;
        }
      }
    }
    if(!ai._announcedWolf){
      ai._announcedWolf = true;
      if(wolfFound) return '我是预言家，' + wolfFound + '号是查杀，大家跟我投。';
      return '我是预言家，昨晚验了个好人。';
    }
    if(wolfFound){
      return pickRandom([
        '预言家视角，' + wolfFound + '号就是狼，别犹豫。',
        '警徽在我这里，' + wolfFound + '号必出。',
        '我再强调：' + wolfFound + '号是查杀。',
        wolfFound + '号你还有什么好说的？'
      ]);
    }
    if(isLate){
      return pickRandom([
        '还剩' + aliveIds.length + '人，我看' + target + '号像狼。',
        '现在关键，我信' + target + '号。'
      ]);
    }
    return pickRandom([
      '我信' + target + '号，其他再看看。',
      '我给' + target + '号一个好人身份。'
    ]);
  }

  if(ai.role === 'wolf'){
    if(suspected){
      return pickRandom([
        '我不是狼，投我会亏一个轮次。',
        '我是好人，别被带节奏了。',
        '你们想清楚，投我等于给狼送分。',
        '我是村民，' + target + '号更像是狼。'
      ]);
    }
    if(hot != null){
      return pickRandom([
        '我跟票，' + hot + '号我也觉得有问题。',
        '大家都怀疑' + hot + '号，那我也出一票。',
        hot + '号发言确实怪，出他。',
        '先出' + hot + '号看看。'
      ]);
    }
    if(isLate){
      return pickRandom([
        '现在信息太少，' + target + '号我觉得不太对。',
        '我怀疑' + target + '号。',
        '场上太安静，' + target + '号你说句话。'
      ]);
    }
    if(day === 1){
      return pickRandom([
        '我是村民，先听发言。',
        '过，没什么信息。',
        '我先过，看谁急。',
        '没什么好说的，我过。',
        '划水听警徽。'
      ]);
    }
    return pickRandom([
      '我过，没什么想说的。',
      '先听其他人，我好人。',
      '我信警徽，跟票。'
    ]);
  }

  if(ai.role === 'witch'){
    if(isLate){
      return pickRandom([
        '我是女巫，药已经用掉了。',
        '女巫视角，我建议出' + target + '号。',
        '我没药了，靠你们。'
      ]);
    }
    return pickRandom([
      '我建议投' + target + '号。',
      '我好人，怀疑' + target + '号。',
      '跟票' + target + '号。',
      '我过，没什么特别想说的。'
    ]);
  }

  if(ai.role === 'hunter'){
    if(suspected){
      return pickRandom([
        '我是好人，投我你们会后悔的。',
        '我身份不小，想清楚再投。',
        '我不是狼，信我。'
      ]);
    }
    return pickRandom([
      '我是好人，建议投' + target + '号。',
      '我建议出' + target + '号。',
      '过，没什么信息。',
      '看警徽，我跟票。'
    ]);
  }

  if(suspected){
    return pickRandom([
      '我村民，投我没意义。',
      '我是好人，你们想清楚。',
      '投我等于亏一轮。'
    ]);
  }
  if(hot != null){
    return pickRandom([
      '我也怀疑' + hot + '号。',
      '跟票' + hot + '号。',
      '大家都说' + hot + '号有问题，我信一下。',
      hot + '号你解释一下？'
    ]);
  }
  if(isLate){
    return pickRandom([
      '最后阶段，' + target + '号你出个身份。',
      '我怀疑' + target + '号。',
      '没头绪，跟票吧。'
    ]);
  }
  return pickRandom([
    '我是村民，先听发言。',
    '过，没什么信息。',
    '我过，看大家怎么说。',
    '先划水，听警徽。',
    '我好人，听你们的。'
  ]);
}

/* ============================================================
   客户端
   ============================================================ */
function joinRoom(){
  var name = ($id('nameIpt') && $id('nameIpt').value.trim()) || '玩家';
  var code = ($id('codeIpt') && $id('codeIpt').value.trim()) || '';
  if(!/^\d{4}$/.test(code)){ lastErr = '请输入 4 位房间号'; render(); return; }
  localStorage.setItem('wolf_name', name);
  lastErr = '';
  render();
  connectAsClient(code, name);
}

function connectAsClient(code, name){
  isHost = false;
  roomTopic = TOPIC_PREFIX + code;
  myTag = getPlayerTag();

  var clientId = 'wolf_c_' + myTag.slice(0, 10) + '_' + Math.random().toString(36).slice(2, 6);
  mqttClient = mqtt.connect(BROKER_URL, {
    clientId: clientId, clean: true, reconnectPeriod: 2000,
    connectTimeout: 15000, keepalive: 30,
    will: {
      topic: roomTopic,
      payload: JSON.stringify({ to: 'host', from: myTag, type: 'leave' }),
      qos: 1, retain: false
    }
  });

  var joined = false, retryTimer = null, tries = 0;

  mqttClient.on('connect', function(){
    setNet(true);
    mqttClient.subscribe(roomTopic, { qos: 1 }, function(err){
      if(err){ lastErr = '订阅失败'; render(); return; }
      tries++;
      mqttClient.publish(roomTopic, JSON.stringify({
        to: 'host', from: myTag, type: 'join', name: name
      }), { qos: 1 });
      if(!retryTimer){
        retryTimer = setInterval(function(){
          if(joined){ clearInterval(retryTimer); retryTimer = null; return; }
          tries++;
          if(tries > 6){
            clearInterval(retryTimer); retryTimer = null;
            lastErr = '找不到房间 ' + code + '，请确认房主已创建';
            G = null; render();
            return;
          }
          mqttClient.publish(roomTopic, JSON.stringify({
            to: 'host', from: myTag, type: 'join', name: name
          }), { qos: 1 });
        }, 3000);
      }
    });
  });

  mqttClient.on('message', function(topic, payload){
    if(topic !== roomTopic) return;
    var msg;
    try { msg = JSON.parse(payload.toString()); } catch(e){ return; }
    if(msg.to !== myTag) return;
    if(msg.type === 'update'){
      joined = true;
      if(retryTimer){ clearInterval(retryTimer); retryTimer = null; }
      G = msg.state;
      if(!G.prompt || G.prompt.kind !== 'witch') witchSel = { heal: undefined, poison: undefined };
      render();
    } else if(msg.type === 'error'){
      joined = true;
      if(retryTimer){ clearInterval(retryTimer); retryTimer = null; }
      lastErr = msg.msg; render();
    }
  });

  mqttClient.on('error', function(err){ console.error('MQTT 错误', err); setNet(false); });
  mqttClient.on('close', function(){ setNet(false); });
  mqttClient.on('reconnect', function(){ setNet(false); });
}

/* ============================================================
   游戏逻辑
   ============================================================ */
function buildPromptFor(player){
  if(host.phase === 'hunter' && player.id === host.hunterId){
    var targets = [];
    for(var it = host.players.values(), p = it.next(); !p.done; p = it.next()){
      if(p.value.alive && p.value.id !== player.id) targets.push(p.value.id);
    }
    return { kind: 'hunter', targets: targets };
  }
  if(!player.alive) return null;
  if(host.phase === 'night'){
    var step = host.nightStep;
    if(step === 0 && player.role === 'guard'){
      var gts = [];
      for(var it = host.players.values(), p = it.next(); !p.done; p = it.next()){
        if(p.value.alive && p.value.id !== host.lastGuard) gts.push(p.value.id);
      }
      return { kind:'guard', targets:gts, note: host.lastGuard ? ('上一晚守护了 ' + host.lastGuard + ' 号') : '' };
    }
    if(step === 1 && player.role === 'wolf'){
      var wts = [], mates = [];
      for(var it = host.players.values(), p = it.next(); !p.done; p = it.next()){
        var pl = p.value;
        if(!pl.alive) continue;
        if(pl.role !== 'wolf') wts.push(pl.id);
        else if(pl.id !== player.id) mates.push(pl.id);
      }
      return { kind:'wolf', targets:wts, mates:mates };
    }
    if(step === 2 && player.role === 'witch'){
      var canHeal = !host.witchHealUsed && host.night.wolfTarget != null;
      var canPoison = !host.witchPoisonUsed;
      if(!canHeal && !canPoison) return null;
      var pts = [];
      for(var it = host.players.values(), p = it.next(); !p.done; p = it.next()){
        if(p.value.alive && p.value.id !== player.id) pts.push(p.value.id);
      }
      return { kind:'witch', canHeal:canHeal, canPoison:canPoison, wolfVictim:host.night.wolfTarget, targets:pts };
    }
    if(step === 3 && player.role === 'seer'){
      if(host.night.seerTarget != null){
        var t = host.players.get(host.night.seerTarget);
        var isWolf = t.role === 'wolf';
        if(!player.seerChecks.some(function(c){return c.id === t.id})){
          player.seerChecks.push({ id: t.id, isWolf: isWolf });
        }
        return { kind:'seerResult', targetId:t.id, isWolf:isWolf };
      }
      var sts = [];
      for(var it = host.players.values(), p = it.next(); !p.done; p = it.next()){
        if(p.value.alive && p.value.id !== player.id) sts.push(p.value.id);
      }
      return { kind:'seer', targets:sts };
    }
    return null;
  }
  if(host.phase === 'sheriffApply'){
    if(!player.alive) return null;
    if(host.sheriffApplied && host.sheriffApplied[player.id]) return null;
    return { kind: 'sheriffApply', targets: [] };
  }
  if(host.phase === 'sheriffVote'){
    if(!player.alive) return null;
    if(host.sheriffVotes[player.id] != null) return null;
    return { kind: 'sheriffVote', targets: host.sheriffCandidates };
  }
  if(host.phase === 'vote' && player.alive){
    if(host.votes[player.id] != null) return null;
    var vts = [];
    for(var it = host.players.values(), p = it.next(); !p.done; p = it.next()){
      if(p.value.alive && p.value.id !== player.id) vts.push(p.value.id);
    }
    return { kind:'vote', targets:vts };
  }
  return null;
}

function hostHandleAction(player, msg){
  var kind = msg.kind, target = msg.target, data = msg.data;
  if(host.phase === 'night'){
    if(kind === 'guard' && player.role === 'guard' && host.nightStep === 0){
      host.night.guardTarget = target; advanceNight();
    } else if(kind === 'wolf' && player.role === 'wolf' && host.nightStep === 1){
      if(host.night.wolfTarget === undefined){ host.night.wolfTarget = target; advanceNight(); }
    } else if(kind === 'witch' && player.role === 'witch' && host.nightStep === 2){
      if(data && data.heal && !host.witchHealUsed){ host.night.heal = true; host.witchHealUsed = true; }
      if(data && data.poison && !host.witchPoisonUsed){ host.night.poison = data.poison; host.witchPoisonUsed = true; }
      host.night.witchDone = true; advanceNight();
    } else if(kind === 'seer' && player.role === 'seer' && host.nightStep === 3){
      if(target != null){ host.night.seerTarget = target; broadcastHostState(); }
      else { host.night.seerDone = true; advanceNight(); }
    } else if(kind === 'forceSkip' && player.id === host.hostId){
      if(host.nightStep === 0){ host.night.guardTarget = null; host.nightStep = 1; }
      else if(host.nightStep === 1){ host.night.wolfTarget = null; host.nightStep = 2; }
      else if(host.nightStep === 2){ host.night.witchDone = true; host.nightStep = 3; }
      else if(host.nightStep === 3){ host.night.seerDone = true; host.nightStep = 4; }
      if(host.nightStep >= 4) resolveNight(); else broadcastHostState();
    }
    return;
  }
  if(host.phase === 'sheriffApply' && kind === 'sheriffApply'){
    if(host.sheriffApplied[player.id]) return;
    host.sheriffApplied[player.id] = true;
    var up = data && data.up;
    if(up && host.sheriffCandidates.indexOf(player.id) === -1) host.sheriffCandidates.push(player.id);
    var allApplied = true;
    for(var it = host.players.values(), p = it.next(); !p.done; p = it.next()){
      if(p.value.alive && !host.sheriffApplied[p.value.id]){ allApplied = false; break; }
    }
    if(allApplied){
      if(host.sheriffCandidates.length === 0) host.phase = 'discuss';
      else if(host.sheriffCandidates.length === 1){
        host.sheriffId = host.sheriffCandidates[0]; host.phase = 'sheriffResult';
      } else {
        host.phase = 'sheriffVote'; host.sheriffVotes = {};
      }
    }
    broadcastHostState();
    return;
  }
  if(host.phase === 'sheriffVote' && kind === 'sheriffVote'){
    if(player.alive && host.sheriffVotes[player.id] == null){
      host.sheriffVotes[player.id] = target;
      var allVoted = true;
      for(var it = host.players.values(), p = it.next(); !p.done; p = it.next()){
        if(p.value.alive && host.sheriffVotes[p.value.id] == null){ allVoted = false; break; }
      }
      if(allVoted) applySheriffVote(); else broadcastHostState();
    }
    return;
  }
  if(host.phase === 'vote'){
    if(kind === 'vote' && player.alive && host.votes[player.id] == null){
      host.votes[player.id] = target;
      var allVoted = true;
      for(var it = host.players.values(), p = it.next(); !p.done; p = it.next()){
        if(p.value.alive && host.votes[p.value.id] == null){ allVoted = false; break; }
      }
      if(allVoted) applyVote(); else broadcastHostState();
    }
    return;
  }
  if(host.phase === 'hunter' && player.id === host.hunterId){
    if(kind === 'hunter'){
      if(target != null){ var t = host.players.get(target); if(t) t.alive = false; }
      if(host.sheriffId && host.players.get(host.sheriffId) && !host.players.get(host.sheriffId).alive){
        host.sheriffId = null; host.sheriffReelection = true;
      }
      if(checkWin()){ endGame(); return; }
      if(host.hunterAfter === 'night'){
        host.phase = 'night'; host.day++; host.nightStep = 0; host.night = {};
        host.deaths = []; host.hunterId = null; broadcastHostState();
      } else { host.phase = 'discuss'; broadcastHostState(); }
    }
  }
}

function advanceNight(){
  function hasRole(r){
    for(var it = host.players.values(), p = it.next(); !p.done; p = it.next()){
      if(p.value.alive && p.value.role === r) return true;
    }
    return false;
  }
  while(host.nightStep < 4){
    if(host.nightStep === 0 && !hasRole('guard')){ host.nightStep = 1; continue; }
    if(host.nightStep === 1 && !hasRole('wolf')) { host.nightStep = 2; continue; }
    if(host.nightStep === 2 && !hasRole('witch')){ host.nightStep = 3; continue; }
    if(host.nightStep === 3 && !hasRole('seer')) { host.nightStep = 4; continue; }
    if(host.nightStep === 0 && host.night.guardTarget !== undefined){ host.nightStep = 1; continue; }
    if(host.nightStep === 1 && host.night.wolfTarget !== undefined){ host.nightStep = 2; continue; }
    if(host.nightStep === 2 && host.night.witchDone){ host.nightStep = 3; continue; }
    if(host.nightStep === 3 && host.night.seerDone){ host.nightStep = 4; continue; }
    break;
  }
  if(host.nightStep >= 4) resolveNight();
  else broadcastHostState();
}

function resolveNight(){
  var deaths = [];
  var wt = host.night.wolfTarget;
  if(wt != null){
    var guarded = host.night.guardTarget === wt;
    var healed = host.night.heal;
    if(!guarded && !healed) deaths.push({ id: wt, cause: 'wolf' });
  }
  if(host.night.poison != null && !deaths.some(function(d){return d.id === host.night.poison})){
    deaths.push({ id: host.night.poison, cause: 'poison' });
  }
  deaths.forEach(function(d){ var p = host.players.get(d.id); if(p) p.alive = false; });
  host.lastGuard = host.night.guardTarget;
  host.deaths = deaths;
  var poisoned = {};
  deaths.forEach(function(d){ if(d.cause === 'poison') poisoned[d.id] = true });
  var hunter = null;
  deaths.forEach(function(d){
    var p = host.players.get(d.id);
    if(p && p.role === 'hunter' && !poisoned[d.id]) hunter = d.id;
  });
  host.hunterId = hunter;
  host.hunterAfter = 'discuss';
  if(host.sheriffId && host.players.get(host.sheriffId) && !host.players.get(host.sheriffId).alive){
    host.sheriffId = null; host.sheriffReelection = true;
  }
  if(host.day === 1 || host.sheriffReelection){
    host.phase = 'sheriffApply';
    host.sheriffCandidates = []; host.sheriffVotes = {}; host.sheriffApplied = {};
    host.sheriffReelection = false;
  } else { host.phase = 'dawn'; }
  broadcastHostState();
}

function checkWin(){
  var alive = [], wolves = 0;
  for(var it = host.players.values(), p = it.next(); !p.done; p = it.next()){
    if(p.value.alive){ alive.push(p.value); if(p.value.role === 'wolf') wolves++; }
  }
  var good = alive.length - wolves;
  if(alive.length === 0){ host.winner = 'wolf'; return true; }
  if(wolves === 0){ host.winner = 'good'; return true; }
  if(wolves >= good){ host.winner = 'wolf'; return true; }
  host.winner = null; return false;
}

function endGame(){
  host.phase = 'over';
  host.allRoles = [];
  for(var it = host.players.values(), p = it.next(); !p.done; p = it.next()){
    host.allRoles.push({ id:p.value.id, role:p.value.role, alive:p.value.alive });
  }
  broadcastHostState();
}

function applySheriffVote(){
  var counts = {};
  for(var k in host.sheriffVotes){
    var t = host.sheriffVotes[k];
    counts[t] = (counts[t] || 0) + 1;
  }
  var max = 0, top = [];
  for(var k in counts){
    var n = counts[k];
    if(n > max){ max = n; top = [Number(k)]; }
    else if(n === max) top.push(Number(k));
  }
  if(top.length === 1){ host.sheriffId = top[0]; }
  else { host.sheriffId = null; }
  host.phase = 'sheriffResult';
  broadcastHostState();
}

function applyVote(){
  var counts = {};
  for(var k in host.votes){
    var t = host.votes[k];
    var weight = (Number(k) === host.sheriffId) ? 2 : 1;
    counts[t] = (counts[t] || 0) + weight;
  }
  var max = 0, top = [];
  for(var k in counts){
    var n = counts[k];
    if(n > max){ max = n; top = [Number(k)]; }
    else if(n === max) top.push(Number(k));
  }
  host.voteResult = { counts: counts, top: top };
  host.phase = 'voteResult';
  broadcastHostState();
}

function hostStartGame(){
  var n = host.players.size;
  if(n < 6 || n > 12) return false;
  var roles = shuffle(ROLE_LIST[n].slice());
  var ids = [];
  for(var it = host.players.keys(), p = it.next(); !p.done; p = it.next()) ids.push(p.value);
  ids.forEach(function(id, i){
    var p = host.players.get(id);
    p.role = roles[i]; p.alive = true; p.seerChecks = [];
    p._announcedWolf = false;
  });
  host.phase = 'night'; host.day = 1; host.nightStep = 0; host.night = {};
  host.lastGuard = null; host.witchHealUsed = false; host.witchPoisonUsed = false;
  host.deaths = []; host.hunterId = null; host.hunterAfter = null;
  host.votes = {}; host.voteResult = null; host.winner = null; host.allRoles = null;
  host.sheriffId = null; host.sheriffCandidates = []; host.sheriffVotes = {}; host.sheriffReelection = false; host.sheriffApplied = {};
  host.chatLog = [];
  host.wolfVoteTarget = null;
  aiLastSpeak = 0;
  broadcastHostState();
  setTimeout(function(){ advanceNight(); }, 200);
  return true;
}

function hostContinue(){
  if(host.phase === 'sheriffResult'){
    if(host.hunterId){ host.phase = 'hunter'; broadcastHostState(); return; }
    host.phase = 'discuss'; broadcastHostState(); return;
  }
  if(host.phase === 'sheriffApply'){
    if(host.sheriffCandidates.length === 0){ host.phase = 'discuss'; broadcastHostState(); return; }
    host.phase = 'sheriffVote'; host.sheriffVotes = {};
    broadcastHostState(); return;
  }
  if(host.phase === 'dawn'){
    if(host.hunterId){ host.phase = 'hunter'; broadcastHostState(); return; }
    host.phase = 'discuss'; broadcastHostState(); return;
  }
  if(host.phase === 'discuss'){
    host.phase = 'vote'; host.votes = {}; host.voteResult = null;
    host.wolfVoteTarget = null;
    broadcastHostState(); return;
  }
  if(host.phase === 'voteResult'){
    var vr = host.voteResult;
    var votedOut = null;
    if(vr.top.length === 1){
      var p = host.players.get(vr.top[0]);
      if(p){ p.alive = false; votedOut = p; }
    }
    if(votedOut && votedOut.id === host.sheriffId){ host.sheriffId = null; host.sheriffReelection = true; }
    if(checkWin()){ endGame(); return; }
    if(votedOut && votedOut.role === 'hunter'){
      host.hunterId = votedOut.id; host.hunterAfter = 'night'; host.phase = 'hunter';
      broadcastHostState(); return;
    }
    host.phase = 'night'; host.day++; host.nightStep = 0; host.night = {};
    host.deaths = []; host.voteResult = null; host.hunterId = null;
    host.wolfVoteTarget = null;
    broadcastHostState();
    setTimeout(function(){ advanceNight(); }, 200);
    return;
  }
  if(host.phase === 'over') restartHost();
}

function restartHost(){
  host.phase = 'lobby'; host.day = 0; host.nightStep = 0; host.night = {};
  host.lastGuard = null; host.witchHealUsed = false; host.witchPoisonUsed = false;
  host.deaths = []; host.hunterId = null; host.hunterAfter = null;
  host.votes = {}; host.voteResult = null; host.winner = null; host.allRoles = null;
  host.sheriffId = null; host.sheriffCandidates = []; host.sheriffVotes = {}; host.sheriffReelection = false; host.sheriffApplied = {};
  host.chatLog = [];
  host.wolfVoteTarget = null;
  aiLastSpeak = 0;
  for(var it = host.players.values(), p = it.next(); !p.done; p = it.next()){
    p.value.role = null; p.value.alive = true; p.value.seerChecks = [];
    p.value._announcedWolf = false;
  }
  broadcastHostState();
}

function sendAction(kind, target, data){
  if(isHost){
    var me = host.players.get(1);
    hostHandleAction(me, { kind: kind, target: target, data: data });
  } else {
    if(mqttClient && mqttClient.connected && roomTopic){
      mqttClient.publish(roomTopic, JSON.stringify({
        to: 'host', from: myTag, type: 'action',
        kind: kind, target: target, data: data
      }), { qos: 1 });
    }
  }
}

function confirmWitch(canHeal, canPoison){

  if(canPoison && witchSel.poison === undefined) return;
  act('witch', null, { heal: canHeal ? !!witchSel.heal : false, poison: canPoison ? witchSel.poison : null });
}

/* ============================================================
   发送文字消息 - 发送后清空输入框
   ============================================================ */
function doChatSend(){
  var ipt = $id('chatIpt');
  if(!ipt) return;
  var text = ipt.value.trim();
  if(!text) return;

  // ① 先记录时间戳（让 render 知道"刚发完，别回填"）
  chatJustSent = Date.now();

  // ② 立即清空输入框
  ipt.value = '';

  // ③ 保持焦点
  try { ipt.focus(); } catch(e){}

  // ④ 异步发送（避免同步 render 的干扰）
  setTimeout(function(){ playerSendChat(text); }, 0);

  // ⑤ 兜底清空两次，防止任何延迟回填
  setTimeout(function(){
    var ni = $id('chatIpt');
    if(ni) ni.value = '';
  }, 30);
  setTimeout(function(){
    var ni = $id('chatIpt');
    if(ni){ ni.value = ''; ni.focus(); }
  }, 200);

  // ⑥ 滚动到底部
  var cb = document.querySelector('.chatbox');
  if(cb) setTimeout(function(){ cb.scrollTop = cb.scrollHeight; }, 60);
}

async function testAIConnection(){
  AI_DEBUG.lastStatus = 'testing';
  AI_DEBUG.lastMessage = '正在测试…';
  render();

  if(!AI_CONFIG.enabled){
    AI_DEBUG.lastStatus = 'error';
    AI_DEBUG.lastMessage = '❌ AI 未启用';
    render(); return;
  }
  if(!canUseLLM()){
    AI_DEBUG.lastStatus = 'error';
    AI_DEBUG.lastMessage = '❌ 配置不完整';
    render(); return;
  }

  queueLLM(async function(){
    var result = await callLLM('你是助手。', '只回复两个字：成功', 10);
    if(result){
      AI_DEBUG.lastStatus = 'ok';
      AI_DEBUG.lastMessage = '✅ 成功！AI 回复："' + result.slice(0, 40) + '"，耗时 ' + AI_DEBUG.lastDuration + 'ms';
    } else if(AI_DEBUG.lastStatus !== 'error'){
      AI_DEBUG.lastStatus = 'error';
      AI_DEBUG.lastMessage = '❌ 测试失败';
    }
    render();
  });
}

/* ============================================================
   渲染
   ============================================================ */
function render(){
  var app = $id('app');
  var oldIpt = $id('chatIpt');
  var hadFocus = oldIpt && document.activeElement === oldIpt;

  // 关键：刚发送完 1 秒内，不保存输入框内容（防止旧值回填）
  var saveIpt = '';
  if(oldIpt && Date.now() - chatJustSent > 1500){
    saveIpt = oldIpt.value;
  }

  if(!G){ app.innerHTML = viewEntry(); }
  else {
    var ph = G.phase, html;
    if(ph === 'lobby')       html = viewLobby();
    else if(ph === 'night')  html = viewNight();
    else if(ph === 'dawn')   html = viewDawn();
    else if(ph === 'sheriffApply') html = viewSheriffApply();
    else if(ph === 'sheriffVote') html = viewSheriffVote();
    else if(ph === 'sheriffResult') html = viewSheriffResult();
    else if(ph === 'hunter') html = viewHunter();
    else if(ph === 'discuss')html = viewDiscuss();
    else if(ph === 'vote')   html = viewVote();
    else if(ph === 'voteResult') html = viewVoteResult();
    else if(ph === 'over')   html = viewOver();
    else html = '<div class="center-screen"><div class="spinner"></div></div>';
    app.innerHTML = html;

    var ni = $id('chatIpt');
    if(ni){
      if(saveIpt) ni.value = saveIpt;
      // 刚发完消息也要保持焦点
      if(hadFocus || Date.now() - chatJustSent < 1500) ni.focus();
    }
    var cb = document.querySelector('.chatbox');
    if(cb) cb.scrollTop = cb.scrollHeight;
  }
}

    ? '<button class="primary big" onclick="confirmWitch(' + needHeal + ',' + needPoison + ')" ' + (ready ? '' : 'disabled') + '>确 认</button>'
    : '';
  var victimTxt = p.wolfVictim != null ? '今晚倒牌的是 <b class="hl">' + p.wolfVictim + '号</b>' : '今晚是平安夜';
  return '<div class="panel">' + topBadge() +
    '<div class="phasehead">🧪 女巫行动</div>' +
    '<div class="statusbar"><span>解药 ' + (p.canHeal ? '✅ 可用' : '❌ 已用') + '</span><span>毒药 ' + (p.canPoison ? '✅ 可用' : '❌ 已用') + '</span></div>' +
    '<div class="bigmsg">' + victimTxt + '</div>' + healBlock + poisonBlock + confirmBtn + '</div>';
}

function viewSeerPrompt(p){
  var hist = (G.you.seerChecks && G.you.seerChecks.length)
    ? '<p class="hint">往期查验：' + G.you.seerChecks.map(function(c){ return c.id + '号=' + (c.isWolf ? '狼' : '好人') }).join('，') + '</p>'
    : '';
  var btns = p.targets.map(function(id){ return '<button class="pcard" onclick="act(\'seer\',' + id + ')">' + id + '号</button>' }).join('');
  return '<div class="panel">' + topBadge() +
    '<div class="phasehead">🔮 预言家行动</div>' +
    '<p class="muted">选择今晚要查验的玩家</p>' + hist +
    '<div class="grid">' + btns + '</div></div>';
}

function viewSeerResult(p){
  return '<div class="panel center">' + topBadge() +
    '<div class="phasehead">🔮 查验结果</div>' +
    '<div class="seerresult ' + (p.isWolf ? 'bad' : 'good') + '">' +
    '<div class="resnum">' + p.targetId + ' 号</div>' +
    '<div class="resverdict">' + (p.isWolf ? '狼 人' : '好 人') + '</div></div>' +
    '<button class="primary big" onclick="act(\'seer\',null)">确认，闭眼</button></div>';
}

function viewSheriffApply(){
  var me = G.you;
  if(!me.alive) return deadBanner();
  var myChoice = G.sheriffApplied && G.sheriffApplied[me.id];
  var isUp = (G.sheriffCandidates || []).indexOf(me.id) !== -1;
  var list = (G.sheriffCandidates || []).map(function(id){ return id + '号'; }).join('、') || '暂无';
  if(myChoice){
    return '<div class="center-screen">' + topBadge() +
      '<div style="font-size:56px">🏅</div>' +
      '<div class="bigmsg">你已' + (isUp ? '上警' : '不上警') + '</div>' +
      '<p class="muted">当前上警名单：' + list + '</p>' +
      '<p class="muted">等待其他玩家表态…</p></div>';
  }
  return '<div class="panel center">' + topBadge() +
    '<div class="phasehead">🏅 警长竞选</div>' +
    '<div class="bigmsg">第 ' + G.day + ' 天 · 上警环节</div>' +
    '<p class="muted">想当警长点【上警】，不想当点【不上警】</p>' +
    '<p class="hint">当前上警名单：' + list + '</p>' +
    '<div style="height:10px"></div>' +
    '<button class="primary big" onclick="act(\'sheriffApply\', null, {up:true})">上 警 竞 选</button>' +
    '<button class="ghost" style="margin-top:10px" onclick="act(\'sheriffApply\', null, {up:false})">不 上 警</button>' +
    '</div>';
}

function viewSheriffVote(){
  var me = G.you;
  if(!me.alive) return deadBanner();
  var p = G.prompt;
  if(p && p.kind === 'sheriffVote'){
    var btns = p.targets.map(function(id){ return '<button class="pcard" onclick="act(\'sheriffVote\',' + id + ')">' + id + '号</button>' }).join('');
    return '<div class="panel">' + topBadge() +
      '<div class="phasehead">🗳️ 警长竞选投票</div>' +
      '<p class="muted">请选择你支持的警长候选人（可以投给自己）</p>' +
      '<div class="grid">' + btns + '</div></div>';
  }
  return '<div class="center-screen">' + topBadge() +
    '<div style="font-size:52px">🗳️</div>' +
    '<div class="bigmsg">你已完成投票</div>' +
    '<p class="muted">等待其他玩家投票…</p></div>';
}

function viewSheriffResult(){
  var me = G.you;
  var sheriffName = G.sheriffId ? (G.sheriffId + '号') : '无（警徽流失）';
  return '<div class="panel center">' + topBadge() +
    '<div class="phasehead">🏅 警长竞选结果</div>' +
    '<div class="bigmsg" style="margin:20px 0;font-size:22px;">' + sheriffName + '</div>' +
    (G.sheriffId ? '<p class="muted">当选警长，投票时拥有 2 票权</p>' : '<p class="muted">平票，警徽流失</p>') +
    (me.isHost ? '<button class="primary big" onclick="doContinue()">继 续</button>' : '<p class="muted">等待房主继续…</p>') + '</div>';
}

function viewDawn(){
  var me = G.you, deaths = G.deaths || [];
  var txt = deaths.length ? deaths.map(function(d){ return d.id + '号' }).join('、') + ' 死亡' : '平安夜，没有人死亡';
  var hasDeath = deaths.length > 0;
  var btn = me.isHost
    ? '<button class="primary big" onclick="doContinue()">继 续</button>'
    : '<p class="muted">等待房主继续…</p>';
  return '<div class="panel center">' + topBadge() +
    '<div style="font-size:44px;margin:10px 0">' + (hasDeath ? '🌅' : '🌈') + '</div>' +
    '<div style="font-size:24px;font-weight:800;letter-spacing:4px;color:#f0d98a">第 ' + G.day + ' 天</div>' +
    '<div class="deathbox ' + (hasDeath ? 'bad' : 'good') + '">' + txt + '</div>' + btn + '</div>';
}

function viewHunter(){
  var me = G.you, isMe = me.id === G.hunterId;
  if(!isMe){
    return '<div class="panel center">' + topBadge() +
      '<div style="font-size:52px;margin:20px 0">🔫</div>' +
      '<div class="bigmsg">' + G.hunterId + ' 号 猎人 翻牌</div>' +
      '<p class="muted">等待猎人选择开枪目标…</p></div>';
  }
  var p = G.prompt;
  var targets = p ? p.targets : G.players.filter(function(x){ return x.alive && x.id !== me.id }).map(function(x){ return x.id });
  var btns = targets.map(function(id){ return '<button class="pcard" onclick="act(\'hunter\',' + id + ')">' + id + '号</button>' }).join('');
  return '<div class="panel">' + topBadge() +
    '<div class="phasehead">🔫 猎人开枪</div>' +
    '<div class="bigmsg">你已死亡，可以带走一名玩家</div>' +
    '<div class="grid">' + btns + '</div>' +
    '<button class="ghost" onclick="act(\'hunter\',null)">放弃开枪</button></div>';
}

function viewChatBox(){
  var chat = G.chatLog || [];
  var meId = G.you.id;
  var items = chat.map(function(c){
    var nameCls = c.isAI ? 'ai-name' : '';
    var meCls = (c.id === meId) ? 'me' : '';
    var tag = '';
    if(c.isAI){
      tag = c.fromModel ? '<span style="color:#6cc98c;font-size:10px">[AI]</span>' :
                          '<span style="color:#8a8aa0;font-size:10px">[模板]</span>';
    }
    return '<div class="chatmsg ' + meCls + '">' + tag + '<b class="' + nameCls + '">' + esc(c.name) + ':</b> ' + esc(c.text) + '</div>';
  }).join('');
  if(!items) items = '<div class="muted" style="font-size:12.5px">暂无发言…</div>';

  return '<div class="chatbox" id="chatBox">' + items + '</div>' +
    '<div class="chatinput">' +
    '<input id="chatIpt" maxlength="60" placeholder="输入消息…" onkeydown="if(event.key===\'Enter\'&&!event.shiftKey){event.preventDefault();doChatSend();}">' +
    '<button class="primary send" onclick="doChatSend()">发送</button>' +
    '</div>';
}

function viewDiscuss(){
  var me = G.you;
  var alive = G.players.filter(function(p){ return p.alive });
  var dead  = G.players.filter(function(p){ return !p.alive });
  var deadLine = dead.length ? '<p class="muted">出局：' + dead.map(function(p){ return p.id + '号' }).join('、') + '</p>' : '';
  var btn = me.isHost
    ? '<button class="primary big" onclick="doContinue()">开始投票</button>'
    : '<p class="muted" style="text-align:center;margin-top:16px">等待房主发起投票…</p>';
  return '<div class="panel">' + topBadge() +
    '<div class="phasehead">☀️ 第 ' + G.day + ' 天 · 讨论</div>' +
    '<div class="bigmsg">存活：' + alive.map(function(p){ return p.id + '号' + (p.isAI ? '(AI)' : '') }).join('、') + '</div>' + deadLine +
    viewChatBox() + btn + '</div>';
}

function viewVote(){
  var me = G.you;
  if(!me.alive) return deadBanner();
  var p = G.prompt;
  if(p && p.kind === 'vote'){
    var btns = p.targets.map(function(id){ return '<button class="pcard" onclick="act(\'vote\',' + id + ')">' + id + '号</button>' }).join('');
    return '<div class="panel">' + topBadge() +
      '<div class="phasehead">🗳️ 请投票</div>' +
      '<p class="muted">选择你认为的狼人</p>' +
      '<div class="grid">' + btns + '</div></div>';
  }
  return '<div class="center-screen">' + topBadge() +
    '<div style="font-size:52px">🗳️</div>' +
    '<div class="bigmsg">你已完成投票</div>' +
    '<p class="muted">等待其他玩家投票…</p></div>';
}

function viewVoteResult(){
  var me = G.you, vr = G.voteResult || { counts:{}, top:[] };
  var sorted = Object.entries(vr.counts).sort(function(a,b){ return b[1] - a[1] });
  var rows = sorted.map(function(kv){
    return '<div class="voterow"><span>' + kv[0] + '号</span><span class="vc">' + kv[1] + ' 票</span></div>';
  }).join('') || '<div class="muted">无有效票</div>';
  var verdict = vr.top.length === 1
    ? '<div class="verdict-box bad">' + vr.top[0] + '号 被投票出局</div>'
    : '<div class="verdict-box">平票（' + vr.top.map(function(i){ return i + '号' }).join('、') + '），本轮无人出局</div>';
  var btn = me.isHost
    ? '<button class="primary big" onclick="doContinue()">继 续</button>'
    : '<p class="muted" style="text-align:center">等待房主继续…</p>';
  return '<div class="panel">' + topBadge() +
    '<div class="phasehead">🗳️ 投票结果</div>' +
    '<div class="votelist">' + rows + '</div>' + verdict + btn + '</div>';
}

function viewOver(){
  var me = G.you, good = G.winner === 'good';
  var all = G.allRoles || [];
  var rows = all.map(function(p){
    var r = ROLE_INFO[p.role] || { name:'?', team:'good', icon:'❔' };
    var sh = p.id === G.sheriffId ? '<span class="sheriff-tag">🏅 警长</span>' : '';
    return '<div class="plrow ' + (p.alive ? '' : 'dead') + '">' +
      '<span class="plid">' + p.id + '号</span>' +
      '<span class="plrole ' + r.team + '">' + r.icon + ' ' + r.name + sh + '</span>' +
      '<span class="plstate">' + (p.alive ? '存活' : '出局') + '</span></div>';
  }).join('');
  var btn = me.isHost
    ? '<button class="primary big" onclick="doRestart()">再 来 一 局</button>'
    : '<p class="muted" style="text-align:center">等待房主开启新一局…</p>';
  return '<div class="panel center" style="justify-content:flex-start;padding-top:6px">' +
    '<div class="overhead ' + (good ? 'good' : 'wolf') + '">' + (good ? '🎉 好人阵营获胜' : '🐺 狼人阵营获胜') + '</div>' +
    '<div class="playerlist">' + rows + '</div>' + btn + '</div>';
}

render();
setNet(false);
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
</script>
</body>
</html>
